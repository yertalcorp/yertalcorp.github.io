<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>2D Space Invaders</title>     <style>         body {             margin: 0;             padding: 0;             background: #05050a;             color: {{accent_color}};             font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;             overflow: hidden;             display: flex;             flex-direction: column;             justify-content: center;             align-items: center;             height: 100vh;         }         #ui-layer {             position: absolute;             top: 20px;             left: 20px;             z-index: 10;             pointer-events: none;             text-transform: uppercase;             letter-spacing: 2px;             text-shadow: 0 0 10px {{accent_color}};         }         #game-container {             position: relative;             perspective: 1000px;             width: 800px;             height: 600px;         }         #game-canvas {             width: 100%;             height: 100%;             background: linear-gradient(180deg, #0a0a1a 0%, #020205 100%);             border: 2px solid {{accent_color}}33;             box-shadow: 0 0 50px rgba(0, 242, 255, 0.1);             transform: rotateX(20deg);             border-radius: 10px;         }         #overlay {             position: absolute;             top: 50%;             left: 50%;             transform: translate(-50%, -50%);             text-align: center;             background: rgba(0, 0, 0, 0.8);             padding: 40px;             border: 1px solid {{accent_color}};             display: none;             z-index: 20;         }         button {             background: transparent;             color: {{accent_color}};             border: 1px solid {{accent_color}};             padding: 10px 20px;             cursor: pointer;             margin-top: 20px;             font-size: 1.2em;             transition: 0.3s;         }         button:hover {             background: {{accent_color}};             color: #000;             box-shadow: 0 0 20px {{accent_color}};         }         #instruction-box {             margin-top: 25px;             padding: 12px 25px;             border: 1px dashed {{accent_color}}55;             background: rgba(10, 10, 26, 0.6);             border-radius: 6px;             font-size: 0.85em;             letter-spacing: 1.5px;             text-transform: uppercase;             text-align: center;             box-shadow: 0 0 15px rgba(0, 242, 255, 0.05);             pointer-events: none;         }         #instruction-box span {             color: #fff;             text-shadow: 0 0 5px {{accent_color}};         }     </style> </head> <body>     <div id="ui-layer">         <div>Score: <span id="score">0</span></div>         <div>High Score: <span id="high-score">0</span></div>         <div>Level: <span id="level-display">1</span> / {{max_levels}}</div>     </div>     <div id="game-container">         <canvas id="game-canvas" width="800" height="600"></canvas>         <div id="overlay">             <h1 id="status-text">GAME OVER</h1>             <p>Score: <span id="final-score">0</span></p>             <button id="action-btn" onclick="handleAction()">RE-INITIALIZE</button>         </div>     </div>     <div id="instruction-box">         CONTROLS: <span>← / → ARROWS</span> TO MOVE | <span>SPACE / ↑ ARROW</span> TO FIRE INTERCEPTOR     </div>     <script>         const canvas = document.getElementById('game-canvas');         const ctx = canvas.getContext('2d');         const scoreEl = document.getElementById('score');         const highScoreEl = document.getElementById('high-score');         const levelDisplayEl = document.getElementById('level-display');         const overlay = document.getElementById('overlay');         const finalScoreEl = document.getElementById('final-score');         const statusText = document.getElementById('status-text');         const actionBtn = document.getElementById('action-btn');          /* --- Configuration Injections --- */         const MAX_LEVELS = parseInt("{{max_levels}}", 10) || 5;         const PLAYER_SPEED = parseFloat("{{player_speed}}") || 7;         const BULLET_SPEED = parseFloat("{{bullet_speed}}") || 10;         const MAX_BULLETS = parseInt("{{max_bullets}}", 10) || 3;         const BASE_ENEMY_SPEED = parseFloat("{{base_enemy_speed}}") || 1.0;         const LEVEL_SPEED_MULTIPLIER = parseFloat("{{level_speed_multiplier}}") || 0.4;         const ENEMY_ROWS = parseInt("{{enemy_rows}}", 10) || 4;         const ENEMY_COLS = parseInt("{{enemy_cols}}", 10) || 8;         const ACCENT_COLOR = "{{accent_color}}";          /* --- System State --- */         let score = 0;         let currentLevel = 1;         let highScore = localStorage.getItem('spatialHighScore') || 0;         highScoreEl.innerText = highScore;         let gameActive = true;         let isLevelClearedState = false;          /* --- Synthesized Web Audio Pipeline --- */         const AudioEngine = {             ctx: null,             init() {                 if (!this.ctx) {                     this.ctx = new (window.AudioContext || window.webkitAudioContext)();                 }                 if (this.ctx.state === 'suspended') {                     this.ctx.resume();                 }             },             playFire() {                 this.init();                 if (!this.ctx) return;                  const osc = this.ctx.createOscillator();                 const gain = this.ctx.createGain();                  osc.type = 'triangle';                 /* Frequency sweep from 880Hz to 220Hz for a classic electronic laser drop */                 osc.frequency.setValueAtTime(880, this.ctx.currentTime);                 osc.frequency.exponentialRampToValueAtTime(220, this.ctx.currentTime + 0.12);                  /* Envelope execution to prevent crackle pops and handle volume ramp down */                 gain.gain.setValueAtTime(0.15, this.ctx.currentTime);                 gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);                  osc.connect(gain);                 gain.connect(this.ctx.destination);                  osc.start();                 osc.stop(this.ctx.currentTime + 0.15);             }         };          /* --- Game Object Layouts --- */         const player = {             x: canvas.width / 2 - 25,             y: 520,             w: 50,             h: 30,             speed: PLAYER_SPEED         };         const bullets = [];         const enemies = [];         const enemyWidth = 40;         const enemyHeight = 30;         const enemyPadding = 20;         let enemyDirection = 1;         let enemySpeed = BASE_ENEMY_SPEED;          const keys = {};         window.addEventListener('keydown', e => {             keys[e.code] = true;             if(e.code === 'ArrowUp' || e.code === 'Space') shoot();         });         window.addEventListener('keyup', e => keys[e.code] = false);          function initEnemies() {             enemies.length = 0;             const totalGridWidth = (ENEMY_COLS * (enemyWidth + enemyPadding)) - enemyPadding;             const startX = (canvas.width - totalGridWidth) / 2;              for (let r = 0; r < ENEMY_ROWS; r++) {                 for (let c = 0; c < ENEMY_COLS; c++) {                     enemies.push({                         x: startX + c * (enemyWidth + enemyPadding),                         y: r * (enemyHeight + enemyPadding) + 60,                         w: enemyWidth,                         h: enemyHeight,                         color: `hsl(${180 + (r * 30)}, 100%, 50%)`,                         alive: true                     });                 }             }         }          function shoot() {             if (!gameActive) return;             if (bullets.length < MAX_BULLETS) {                 bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 15 });                 AudioEngine.playFire();             }         }          function draw3DBox(x, y, w, h, color, depth = 10) {             ctx.fillStyle = color;             ctx.fillRect(x, y, w, h);                          ctx.fillStyle = 'rgba(0,0,0,0.3)';             ctx.beginPath();             ctx.moveTo(x, y);             ctx.lineTo(x - depth, y - depth);             ctx.lineTo(x - depth, y + h - depth);             ctx.lineTo(x, y + h);             ctx.fill();                          ctx.fillStyle = 'rgba(255,255,255,0.1)';             ctx.beginPath();             ctx.moveTo(x, y);             ctx.lineTo(x + w, y);             ctx.lineTo(x + w - depth, y - depth);             ctx.lineTo(x - depth, y - depth);             ctx.fill();                          ctx.shadowBlur = 15;             ctx.shadowColor = color;         }          function update() {             if (!gameActive) return;              if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;             if (keys['ArrowRight'] && player.x < canvas.width - player.w) player.x += player.speed;              bullets.forEach((b, index) => {                 b.y -= BULLET_SPEED;                 if (b.y < 0) bullets.splice(index, 1);             });              let edgeHit = false;             enemies.forEach(e => {                 if (!e.alive) return;                 e.x += enemyDirection * enemySpeed;                 if (e.x + e.w > canvas.width || e.x < 0) edgeHit = true;                 if (e.y + e.h > player.y) gameOver(false);             });              if (edgeHit) {                 enemyDirection *= -1;                 enemies.forEach(e => e.y += 20);                 enemySpeed += 0.15;             }              bullets.forEach((b, bi) => {                 enemies.forEach((e, ei) => {                     if (e.alive && b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {                         e.alive = false;                         bullets.splice(bi, 1);                         score += 100;                         scoreEl.innerText = score;                     }                 });             });              if (enemies.every(e => !e.alive)) {                 if (currentLevel < MAX_LEVELS) {                     levelCleared();                 } else {                     gameOver(true);                 }             }         }          function drawGrid() {             ctx.strokeStyle = ACCENT_COLOR + '11';             ctx.lineWidth = 1;             ctx.shadowBlur = 0;             for(let i=0; i<canvas.width; i+=40) {                 ctx.beginPath();                 ctx.moveTo(i, 0);                 ctx.lineTo(i, canvas.height);                 ctx.stroke();             }             for(let i=0; i<canvas.height; i+=40) {                 ctx.beginPath();                 ctx.moveTo(0, i);                 ctx.lineTo(canvas.width, i);                 ctx.stroke();             }         }          function draw() {             ctx.clearRect(0, 0, canvas.width, canvas.height);             drawGrid();              draw3DBox(player.x, player.y, player.w, player.h, ACCENT_COLOR, 8);              bullets.forEach(b => {                 ctx.fillStyle = '#fff';                 ctx.shadowBlur = 10;                 ctx.shadowColor = ACCENT_COLOR;                 ctx.fillRect(b.x, b.y, b.w, b.h);             });              enemies.forEach(e => {                 if (e.alive) {                     draw3DBox(e.x, e.y, e.w, e.h, e.color, 12);                 }             });              requestAnimationFrame(() => {                 update();                 draw();             });         }          function levelCleared() {             gameActive = false;             isLevelClearedState = true;             statusText.innerText = `LEVEL ${currentLevel} CLEARED`;             statusText.style.color = ACCENT_COLOR;             finalScoreEl.innerText = score;             actionBtn.innerText = "ADVANCE TO NEXT SECTOR";             overlay.style.display = 'block';         }          function advanceLevel() {             currentLevel++;             levelDisplayEl.innerText = currentLevel;             overlay.style.display = 'none';             bullets.length = 0;             enemySpeed = BASE_ENEMY_SPEED + (currentLevel - 1) * LEVEL_SPEED_MULTIPLIER;             enemyDirection = 1;             isLevelClearedState = false;             gameActive = true;             initEnemies();         }          function gameOver(win) {             gameActive = false;             isLevelClearedState = false;             statusText.innerText = win ? "GALAXY SECURED" : "SYSTEM BREACH";             statusText.style.color = win ? ACCENT_COLOR : "#ff0055";             finalScoreEl.innerText = score;             actionBtn.innerText = "RE-INITIALIZE SYSTEM";             overlay.style.display = 'block';              if (score > highScore) {                 highScore = score;                 localStorage.setItem('spatialHighScore', highScore);                 highScoreEl.innerText = highScore;             }         }          function handleAction() {             if (isLevelClearedState) {                 advanceLevel();             } else {                 resetGame();             }         }          function resetGame() {             score = 0;             currentLevel = 1;             enemySpeed = BASE_ENEMY_SPEED;             enemyDirection = 1;             scoreEl.innerText = score;             levelDisplayEl.innerText = currentLevel;             overlay.style.display = 'none';             bullets.length = 0;             isLevelClearedState = false;             gameActive = true;             initEnemies();         }          initEnemies();         draw();     </script> </body> </html>
