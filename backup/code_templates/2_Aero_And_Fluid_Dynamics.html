<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>AeroFlux 3D - Fluid Dynamics Lab</title>     <style>         :root {             --bg: #050508;             --panel: rgba(20, 25, 40, 0.85);             --accent: #00f2ff;             --wall: #3a4452;         }         body {             margin: 0;             padding: 0;             background: var(--bg);             color: white;             font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;             overflow: hidden;             display: flex;             flex-direction: column;             align-items: center;             justify-content: center;             height: 100vh;             width: 100vw;         }         #ui-layer {             position: absolute;             top: 20px;             left: 20px;             z-index: 10;             background: var(--panel);             padding: 20px;             border-radius: 12px;             backdrop-filter: blur(10px);             border: 1px solid rgba(255, 255, 255, 0.1);             box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);             pointer-events: auto;             width: 260px;         }         h1 {             margin: 0 0 10px 0;             font-size: 1.4rem;             background: linear-gradient(90deg, #00f2ff, #7000ff);             -webkit-background-clip: text;             -webkit-text-fill-color: transparent;             letter-spacing: 1px;         }         .instruction {             font-size: 0.85rem;             color: #ccc;             margin-bottom: 15px;             line-height: 1.4;         }         .controls {             display: flex;             flex-direction: column;             gap: 10px;         }         button {             background: #2a2f3a;             border: 1px solid #444;             color: white;             padding: 8px 12px;             border-radius: 6px;             cursor: pointer;             transition: all 0.2s;             font-weight: 600;         }         button:hover {             background: var(--accent);             color: black;         }         .stats {             font-family: monospace;             font-size: 0.75rem;             margin-top: 15px;             color: var(--accent);         }         #canvas-container {             position: relative;             width: 100%;             height: 100%;             display: flex;             align-items: center;             justify-content: center;         }         canvas {             image-rendering: pixelated;             cursor: crosshair;             box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 242, 255, 0.1);             border-radius: 6px;             background: #020205;             border: 1px solid rgba(0, 242, 255, 0.2);         }         .label-tag {             font-size: 10px;             text-transform: uppercase;             color: #777;             margin-bottom: 4px;         }     </style> </head> <body>     <div id="ui-layer">         <h1>AEROFLUX 3D</h1>         <p class="instruction">             <b>Left Click:</b> Draw Obstacles<br>             <b>Right Click/Ctrl:</b> Inject Fluid<br>             <b>Visuals:</b> Gradient Velocity Field         </p>         <div class="controls">             <div class="label-tag">Simulation</div>             <button onclick="resetSim()">Clear Obstacles</button>             <button onclick="toggleFlow()" id="flowBtn">Pause Global Flow</button>             <div class="label-tag">Visuals</div>             <button onclick="toggleMode()" id="modeBtn">View: Pressure</button>         </div>         <div class="stats" id="stats">FPS: 60 | Particles: Active</div>     </div>     <div id="canvas-container">         <canvas id="fluidCanvas"></canvas>     </div> <script> /* --- Configuration Injection Inits --- */ const ITERATIONS = parseInt("{{iterations}}", 10) || 16; const DT = parseFloat("{{dt}}") || 0.15; const DIFFUSION = parseFloat("{{diffusion}}") || 0.0001; const VISCOSITY = parseFloat("{{viscosity}}") || 0.00001; const ACCENT_COLOR = "{{accent_color}}".startsWith('{') ? "#00f2ff" : "{{accent_color}}"; const BASE_FLOW_DENSITY = parseFloat("{{base_flow_density}}") || 5; const BASE_FLOW_VELOCITY_X = parseFloat("{{base_flow_velocity_x}}") || 0.5;  /* --- Dimensions Managed Fluid-Grid Struct --- */ const canvas = document.getElementById('fluidCanvas'); const ctx = canvas.getContext('2d', { alpha: false }); const stats = document.getElementById('stats');  let SCALE = 12; let WIDTH = 80; let HEIGHT = 50; let flowEnabled = true; let viewMode = 'velocity'; let fluid = null;  class FluidGrid {     constructor(w, h) {         this.w = w;         this.h = h;         this.size = w * h;         this.density = new Float32Array(this.size);         this.vX = new Float32Array(this.size);         this.vY = new Float32Array(this.size);         this.vX0 = new Float32Array(this.size);         this.vY0 = new Float32Array(this.size);         this.s = new Float32Array(this.size);         this.obstacles = new Uint8Array(this.size);     }     addDensity(x, y, amount) {         let idx = x + y * this.w;         if(idx >= 0 && idx < this.size) this.density[idx] += amount;     }     addVelocity(x, y, px, py) {         let idx = x + y * this.w;         if(idx >= 0 && idx < this.size) {             this.vX[idx] += px;             this.vY[idx] += py;         }     }     step() {         diffuse(1, this.vX0, this.vX, VISCOSITY, DT, ITERATIONS, this.w, this.h, this.obstacles);         diffuse(2, this.vY0, this.vY, VISCOSITY, DT, ITERATIONS, this.w, this.h, this.obstacles);         project(this.vX0, this.vY0, this.vX, this.vY, ITERATIONS, this.w, this.h, this.obstacles);         advect(1, this.vX, this.vX0, this.vX0, this.vY0, DT, this.w, this.h, this.obstacles);         advect(2, this.vY, this.vY0, this.vX0, this.vY0, DT, this.w, this.h, this.obstacles);         project(this.vX, this.vY, this.vX0, this.vY0, ITERATIONS, this.w, this.h, this.obstacles);                  /* Reinforce horizontal stream velocity across the entire active grid area to overcome pressure drag stalling */         if (flowEnabled) {             for (let j = 1; j < this.h - 1; j++) {                 for (let i = 1; i < this.w - 1; i++) {                     let idx = i + j * this.w;                     if (!this.obstacles[idx]) {                         this.vX[idx] += BASE_FLOW_VELOCITY_X * 0.1;                     }                 }             }         }         diffuse(0, this.s, this.density, DIFFUSION, DT, ITERATIONS, this.w, this.h, this.obstacles);         advect(0, this.density, this.s, this.vX, this.vY, DT, this.w, this.h, this.obstacles);     } }  /* --- Responsive Scaling Matrix --- */ function resizeToViewport() {     const marginWidth = window.innerWidth * 0.85;     const marginHeight = window.innerHeight * 0.85;           WIDTH = Math.min(120, Math.max(60, Math.floor(marginWidth / 12)));     HEIGHT = Math.min(80, Math.max(40, Math.floor(marginHeight / 12)));           canvas.width = WIDTH * SCALE;     canvas.height = HEIGHT * SCALE;           const savedObstacles = fluid ? fluid.obstacles : null;     fluid = new FluidGrid(WIDTH, HEIGHT);     if (savedObstacles) {         for(let i=0; i<Math.min(savedObstacles.length, fluid.size); i++) {             fluid.obstacles[i] = savedObstacles[i];         }     } }  /* --- Navier-Stokes Solver Implementations --- */ function set_bnd(b, x, w, h, obstacles) {     for (let i = 1; i < h - 1; i++) {         x[i * w] = b === 1 ? -x[1 + i * w] : x[1 + i * w];         x[(w - 1) + i * w] = b === 1 ? -x[(w - 2) + i * w] : x[(w - 2) + i * w];     }     for (let i = 1; i < w - 1; i++) {         x[i] = b === 2 ? -x[i + w] : x[i + w];         x[i + (h - 1) * w] = b === 2 ? -x[i + (h - 2) * w] : x[i + (h - 2) * w];     }     for (let j = 1; j < h - 1; j++) {         for (let i = 1; i < w - 1; i++) {             let idx = i + j * w;             if (obstacles[idx]) {                 if (b === 1) x[idx] = -x[idx - 1];                 else if (b === 2) x[idx] = -x[idx - w];                 else x[idx] = 0;             }         }     } }  function lin_solve(b, x, x0, a, c, iter, w, h, obstacles) {     let cRecip = 1.0 / c;     for (let k = 0; k < iter; k++) {         for (let j = 1; j < h - 1; j++) {             for (let i = 1; i < w - 1; i++) {                 let idx = i + j * w;                 if (!obstacles[idx]) {                     x[idx] = (x0[idx] + a * (x[idx - 1] + x[idx + 1] + x[idx - w] + x[idx + w])) * cRecip;                 }             }         }         set_bnd(b, x, w, h, obstacles);     } }  function diffuse(b, x, x0, diff, dt, iter, w, h, obstacles) {     let a = dt * diff * (w - 2) * (h - 2);     lin_solve(b, x, x0, a, 1 + 6 * a, iter, w, h, obstacles); }  function project(velocX, velocY, p, div, iter, w, h, obstacles) {     for (let j = 1; j < h - 1; j++) {         for (let i = 1; i < w - 1; i++) {             div[i + j * w] = -0.5 * (                 velocX[i + 1 + j * w] - velocX[i - 1 + j * w] +                 velocY[i + (j + 1) * w] - velocY[i + (j - 1) * w]             ) / ((w + h) / 2);             p[i + j * w] = 0;         }     }     set_bnd(0, div, w, h, obstacles);     set_bnd(0, p, w, h, obstacles);     lin_solve(0, p, div, 1, 6, iter, w, h, obstacles);     for (let j = 1; j < h - 1; j++) {         for (let i = 1; i < w - 1; i++) {             velocX[i + j * w] -= 0.5 * (p[i + 1 + j * w] - p[i - 1 + j * w]) * ((w + h) / 2);             velocY[i + j * w] -= 0.5 * (p[i + (j + 1) * w] - p[i + (j - 1) * w]) * ((w + h) / 2);         }     }     set_bnd(1, velocX, w, h, obstacles);     set_bnd(2, velocY, w, h, obstacles); }  function advect(b, d, d0, velocX, velocY, dt, w, h, obstacles) {     let i0, i1, j0, j1;     let dtx = dt * (w - 2);     let dty = dt * (h - 2);     let s0, s1, t0, t1;     let tmp1, tmp2, x, y;     for (let j = 1; j < h - 1; j++) {         for (let i = 1; i < w - 1; i++) {             let idx = i + j * w;             if (obstacles[idx]) continue;             tmp1 = dtx * velocX[idx];             tmp2 = dty * velocY[idx];             x = i - tmp1;             y = j - tmp2;             if (x < 0.5) x = 0.5;             if (x > w - 1.5) x = w - 1.5;             i0 = Math.floor(x);             i1 = i0 + 1.0;             if (y < 0.5) y = 0.5;             if (y > h - 1.5) y = h - 1.5;             j0 = Math.floor(y);             j1 = j0 + 1.0;             s1 = x - i0;             s0 = 1.0 - s1;             t1 = y - j0;             t0 = 1.0 - t1;             d[idx] = s0 * (t0 * d0[i0 + j0 * w] + t1 * d0[i0 + j1 * w]) +                      s1 * (t0 * d0[i1 + j0 * w] + t1 * d0[i1 + j1 * w]);         }     }     set_bnd(b, d, w, h, obstacles); }  /* --- Control Functions --- */ function resetSim() {     fluid.obstacles.fill(0);     fluid.density.fill(0); }  /* --- Input Translation Handlers --- */ let isMouseDown = false; let isRightClick = false;  canvas.onmousedown = (e) => {     isMouseDown = true;     isRightClick = e.button === 2 || e.ctrlKey;     e.preventDefault(); };  window.onmouseup = () => isMouseDown = false; canvas.oncontextmenu = (e) => e.preventDefault();  canvas.onmousemove = (e) => {     if (!isMouseDown) return;     const rect = canvas.getBoundingClientRect();           const rawX = (e.clientX - rect.left) / rect.width;     const rawY = (e.clientY - rect.top) / rect.height;           const mouseX = Math.floor(rawX * WIDTH);     const mouseY = Math.floor(rawY * HEIGHT);           if (mouseX > 0 && mouseX < WIDTH - 1 && mouseY > 0 && mouseY < HEIGHT - 1) {         if (isRightClick) {             fluid.addDensity(mouseX, mouseY, 500);             fluid.addVelocity(mouseX, mouseY, 5, 0);         } else {             /* FIX: Repaired corrupted ox context loop mutation variable */             for(let oy=-1; oy<=1; oy++) {                  for(let ox=-1; ox<=1; ox++) {                      let idx = (mouseX+ox) + (mouseY+oy) * WIDTH;                      if(idx >= 0 && idx < fluid.size) {                          fluid.obstacles[idx] = 1;                          fluid.density[idx] = 0;                      }                  }             }         }     } };  function toggleFlow() {     flowEnabled = !flowEnabled;     document.getElementById('flowBtn').innerText = flowEnabled ? "Pause Global Flow" : "Resume Global Flow"; }  function toggleMode() {     viewMode = viewMode === 'velocity' ? 'pressure' : 'velocity';     document.getElementById('modeBtn').innerText = "View: " + viewMode.charAt(0).toUpperCase() + viewMode.slice(1); }  /* --- Render Pipeline Loop --- */ function draw() {     if (flowEnabled) {         /* Continuous color fluid injection source at the far left boundary edge */         for (let j = 1; j < HEIGHT - 1; j++) {             fluid.addDensity(1, j, BASE_FLOW_DENSITY);         }     }     fluid.step();       ctx.fillStyle = '#050508';     ctx.fillRect(0, 0, canvas.width, canvas.height);       /* Phase 1: Draw Pseudo-3D Isometric Volumetric Shadow Drops */     ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';     for (let j = 0; j < HEIGHT; j++) {         for (let i = 0; i < WIDTH; i++) {             let idx = i + j * WIDTH;             if (fluid.obstacles[idx]) {                 ctx.fillRect(i * SCALE + 4, j * SCALE + 4, SCALE, SCALE);             }         }     }       /* Phase 2: Compute Fluid Density Gradients and Draw Obstacle Height Extrusions */     for (let j = 0; j < HEIGHT; j++) {         for (let i = 0; i < WIDTH; i++) {             let idx = i + j * WIDTH;                           if (fluid.obstacles[idx]) {                 ctx.fillStyle = '#161a22';                 ctx.fillRect(i * SCALE + 2, j * SCALE + 2, SCALE, SCALE);                                                   ctx.fillStyle = '#2d3542';                 ctx.fillRect(i * SCALE, j * SCALE, SCALE, SCALE);                                                   ctx.strokeStyle = '#4a5568';                 ctx.lineWidth = 0.5;                 ctx.strokeRect(i * SCALE, j * SCALE, SCALE, SCALE);                 continue;             }                           let d = fluid.density[idx];             if (d > 0.1) {                 let r, g, b;                 if (viewMode === 'velocity') {                     let vel = Math.sqrt(fluid.vX[idx]**2 + fluid.vY[idx]**2) * 10;                     r = Math.min(255, d * 0.5);                     g = Math.min(255, 100 + vel * 20 + d);                     b = Math.min(255, 200 + vel * 10);                 } else {                     r = Math.min(255, d * 10);                     g = Math.min(255, d * 2);                     b = Math.min(255, 255 - d * 5);                 }                 ctx.fillStyle = `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;                 ctx.fillRect(i * SCALE, j * SCALE, SCALE, SCALE);             }         }     }       renderFlowLines();     requestAnimationFrame(draw); }  function renderFlowLines() {     ctx.beginPath();     ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';     ctx.lineWidth = 1.5;     for (let i = 0; i < WIDTH; i += 4) {         for (let j = 0; j < HEIGHT; j += 4) {             let idx = i + j * WIDTH;             if (fluid.obstacles[idx]) continue;             let vx = fluid.vX[idx] * 24;             let vy = fluid.vY[idx] * 24;             ctx.moveTo(i * SCALE + 2, j * SCALE + 3);             ctx.lineTo(i * SCALE + vx + 2, j * SCALE + vy + 3);         }     }     ctx.stroke();       ctx.beginPath();     ctx.strokeStyle = ACCENT_COLOR === "#00f2ff" ? 'rgba(0, 242, 255, 0.15)' : ACCENT_COLOR + '22';     ctx.lineWidth = 1;     for (let i = 0; i < WIDTH; i += 4) {         for (let j = 0; j < HEIGHT; j += 4) {             let idx = i + j * WIDTH;             if (fluid.obstacles[idx]) continue;             let vx = fluid.vX[idx] * 24;             let vy = fluid.vY[idx] * 24;             ctx.moveTo(i * SCALE, j * SCALE);             ctx.lineTo(i * SCALE + vx, j * SCALE + vy);         }     }     ctx.stroke(); }  /* --- Initialization Sequences --- */ window.addEventListener('resize', resizeToViewport); resizeToViewport(); draw();  setInterval(() => {     stats.innerText = `FPS: 60 | Grid: ${WIDTH}x${HEIGHT} | Flow: ${flowEnabled ? 'Active' : 'Static'}`; }, 1000); </script> </body> </html>
