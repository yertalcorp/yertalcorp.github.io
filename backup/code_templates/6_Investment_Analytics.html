<!DOCTYPE html><html lang='en'><head>    <meta charset='UTF-8'>    <meta name='viewport' content='width=device-width, initial-scale=1.0'>    <title>Dividend Growth Vista</title>    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>    <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script>    <style>        :root {            --primary: #6366f1;            --secondary: #a855f7;            --bg: #0f172a;            --glass: rgba(255, 255, 255, 0.1);        }        body, html {            margin: 0;            padding: 0;            font-family: 'Inter', sans-serif;            background: var(--bg);            color: white;            height: 100vh;            overflow: hidden;            display: flex;        }        #three-canvas {            position: absolute;            top: 0; left: 0; z-index: -1;        }        .container {            display: flex;            width: 100%;            height: 100%;            backdrop-filter: blur(10px);            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(88, 28, 135, 0.4));        }        .sidebar {            width: 350px;            padding: 2rem;            background: var(--glass);            border-right: 1px solid rgba(255,255,255,0.1);            display: flex;            flex-direction: column;            gap: 1.5rem;            overflow-y: auto;        }        .main-content {            flex-grow: 1;            padding: 2rem;            display: flex;            flex-direction: column;            align-items: center;            justify-content: center;        }        .input-group {            display: flex;            flex-direction: column;            gap: 0.5rem;        }        input, select {            background: rgba(255,255,255,0.05);            border: 1px solid rgba(255,255,255,0.2);            padding: 0.8rem;            border-radius: 8px;            color: white;            font-size: 1rem;        }        select option {            background: var(--bg);            color: white;        }        label {            font-size: 0.85rem;            text-transform: uppercase;            letter-spacing: 1px;            color: #94a3b8;        }        h1 {            margin: 0 0 1rem 0;            font-weight: 800;            background: linear-gradient(to right, #818cf8, #d946ef);            -webkit-background-clip: text;            -webkit-text-fill-color: transparent;        }        .chart-wrapper {            width: 90%;            max-width: 900px;            background: var(--glass);            padding: 20px;            border-radius: 20px;            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);            border: 1px solid rgba(255,255,255,0.1);        }        .stats {            display: grid;            grid-template-columns: 1fr 1fr;            gap: 1rem;            margin-top: 1rem;        }        .stat-card {            background: rgba(0,0,0,0.2);            padding: 1rem;            border-radius: 12px;            text-align: center;        }        .stat-value { font-size: 1.2rem; font-weight: bold; color: #fbbf24; }    </style></head><body>    <div id='three-canvas'></div>        <div class='container'>        <aside class='sidebar'>            <h1>INVEST PRO</h1>            <div class='input-group'>                <label>Currency</label>                <select id='currency' onchange='updateCurrency()'>                    <option value='INR'>INR (₹)</option>                    <option value='USD'>USD ($)</option>                    <option value='EUR'>EUR (€)</option>                    <option value='GBP'>GBP (£)</option>                    <option value='JPY'>JPY (¥)</option>                </select>            </div>            <div class='input-group'>                <label>Initial Investment (<span class='curr-sym'>₹</span>)</label>                <input type='number' id='initInvest' value='{{INITIAL_INVESTMENT_AMOUNT}}' oninput='updateChart()'>            </div>            <div class='input-group'>                <label>Monthly Contribution (<span class='curr-sym'>₹</span>)</label>                <input type='number' id='monthly' value='500' oninput='updateChart()'>            </div>            <div class='input-group'>                <label>Capital Appreciation (%)</label>                <input type='number' id='appreciation' value='7' oninput='updateChart()'>            </div>            <div class='input-group'>                <label>Dividend Yield Rate (%)</label>                <input type='number' id='divYield' value='{{DEFAULT_DIVIDEND_YIELD_RATE}}' oninput='updateChart()'>            </div>            <div class='stats'>                <div class='stat-card'>                    <label>{{COMPOUND_INTEREST_TRACKING_YEARS}}Y Total</label>                    <div class='stat-value' id='totalVal'><span class='curr-sym'>₹</span>0</div>                </div>                <div class='stat-card'>                    <label>Total Dividends</label>                    <div class='stat-value' id='totalDiv'><span class='curr-sym'>₹</span>0</div>                </div>            </div>        </aside>        <main class='main-content'>            <div class='chart-wrapper'>                <canvas id='growthChart'></canvas>            </div>        </main>    </div>    <script>const params = {            assetGrowthPaths: [],             dividendYieldRates: {{DEFAULT_DIVIDEND_YIELD_RATE}},             compoundInterestTotal: {{INITIAL_INVESTMENT_AMOUNT}},             chartInstance: null        };        const currencyMap = {            INR: '₹',            USD: '$',            EUR: '€',            GBP: '£',            JPY: '¥'        };        let currentSymbol = currencyMap['{{DEFAULT_CURRENCY}}'];        /* 1. Initialize 3D Background */        const init3D = () => {            const scene = new THREE.Scene();            const camera = new THREE.PerspectiveCamera(75,  window.innerWidth / window.innerHeight,  0.1,  1000);            const renderer = new THREE.WebGLRenderer({ alpha: true,  antialias: true });            renderer.setSize(window.innerWidth, window.innerHeight);            document.getElementById('three-canvas').appendChild(renderer.domElement);            const geometry = new THREE.IcosahedronGeometry(10,  1);            const material = new THREE.MeshPhongMaterial({                 color: 0x6366f1,                  wireframe: true,                  transparent: true,                  opacity: 0.2             });            const sphere = new THREE.Mesh(geometry,  material);            scene.add(sphere);            const light = new THREE.PointLight(0xffffff,  1,  100);            light.position.set(10, 10, 10);            scene.add(light);            camera.position.z = 20;            function animate() {                requestAnimationFrame(animate);                sphere.rotation.x += 0.002;                sphere.rotation.y += 0.002;                renderer.render(scene, camera);            }            animate();            window.addEventListener('resize', () => {                camera.aspect = window.innerWidth / window.innerHeight;                camera.updateProjectionMatrix();                renderer.setSize(window.innerWidth, window.innerHeight);            });        };        /* 2. Currency Management */        const updateCurrency = () => {            const select = document.getElementById('currency');            currentSymbol = currencyMap[select.value];            const symElements = document.querySelectorAll('.curr-sym');            symElements.forEach(el => {                el.innerText = currentSymbol;            });            updateChart();        };        /* 3. Calculation Logic */        const calculateGrowth = () => {            const initial = parseFloat(document.getElementById('initInvest').value) || 0;            const monthly = parseFloat(document.getElementById('monthly').value) || 0;            const growthRate = (parseFloat(document.getElementById('appreciation').value) / 100) / 12;            const divRate = (parseFloat(document.getElementById('divYield').value) / 100) / 12;                                    let balance = initial;            let divTotal = {{STARTING_DIVIDEND_TOTAL}};            const years = {{COMPOUND_INTEREST_TRACKING_YEARS}};            const dataPoints = [];            const labels = [];            for (let m = 0; m <= years * 12; m++) {                if (m > 0) {                    const divEarnings = balance * divRate;                    const appreciation = balance * growthRate;                    balance += divEarnings + appreciation + monthly;                    divTotal += divEarnings;                }                if (m % 12 === 0) {                    dataPoints.push(Math.round(balance));                    labels.push(`Yr ${m/12}`);                }            }            document.getElementById('totalVal').innerText = currentSymbol + Math.round(balance).toLocaleString();            document.getElementById('totalDiv').innerText = currentSymbol + Math.round(divTotal).toLocaleString();            return { labels, dataPoints };        };        /* 4. Chart Rendering */        const updateChart = () => {            const { labels,  dataPoints } = calculateGrowth();                        if (params.chartInstance) {                params.chartInstance.destroy();            }            const ctx = document.getElementById('growthChart').getContext('2d');            const gradient = ctx.createLinearGradient(0,  0,  0,  400);            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.5)');            gradient.addColorStop(1, 'rgba(168, 85, 247, 0.0)');            params.chartInstance = new Chart(ctx, {                type: 'line',                data: {                    labels: labels,                    datasets: [{                        label: 'Portfolio Value',                        data: dataPoints,                        borderColor: '#818cf8',                        borderWidth: 3,                        pointBackgroundColor: '#d946ef',                        pointRadius: 0,                        pointHoverRadius: 6,                        fill: true,                        backgroundColor: gradient,                        tension: 0.4                    }]                },                options: {                    responsive: true,                    maintainAspectRatio: false,                    plugins: {                        legend: { display: false },                        tooltip: {                            mode: 'index',                            intersect: false,                            backgroundColor: 'rgba(15, 23, 42, 0.9)',                            titleColor: '#818cf8',                            padding: 12,                            cornerRadius: 10,                            callbacks: {                                label: function(context) {                                    return context.dataset.label + ': ' + currentSymbol + context.parsed.y.toLocaleString();                                }                            }                        }                    },                    scales: {                        x: {                            grid: { display: false },                            ticks: { color: '#94a3b8' }                        },                        y: {                            grid: { color: 'rgba(255,255,255,0.05)' },                            ticks: {                                 color: '#94a3b8',                                callback: (value) => currentSymbol + value.toLocaleString()                            }                        }                    }                }            });        };        /* Initialize */        window.onload = () => {            document.getElementById('currency').value = '{{DEFAULT_CURRENCY}}';            updateCurrency();            init3D();        };</script></body></html>
