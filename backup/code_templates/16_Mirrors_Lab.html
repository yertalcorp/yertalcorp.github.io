<!DOCTYPE html> <html lang="en"> <head>      <meta charset="UTF-8">      <meta name="viewport" content="width=device-width, initial-scale=1.0">      <title>Neon Optics Lab</title>      <style>          body {              margin: 0;              overflow: hidden;              background: radial-gradient(circle at center, {{ BG_COLOR_START }} 0%, {{ BG_COLOR_END }} 100%);              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;              color: white;              user-select: none;          }          canvas {              display: block;          }          #ui {              position: absolute;              top: 20px;              left: 20px;              background: {{ UI_BACKGROUND }};              padding: 15px;              border-radius: 12px;              backdrop-filter: blur(10px);              border: 1px solid rgba(255, 255, 255, 0.1);              pointer-events: none;          }          .hint {              font-size: 0.85em;              color: #888;              margin-top: 5px;          }          b { color: {{ ACCENT_COLOR }}; }      </style> </head> <body>      <div id="ui">          <h2 style="margin: 0 0 10px 0;">Neon Optics Lab</h2>          <div class="hint">Drag <b>mirrors</b> to reposition.</div>          <div class="hint">Use <b>mouse wheel</b> to rotate mirrors.</div>          <div class="hint">Drag <b>laser</b> to change source.</div>      </div>      <canvas id="canvas"></canvas>      <script>          const canvas = document.getElementById('canvas');          const ctx = canvas.getContext('2d');          let width, height;          let mirrors = [];          let laserSource = { x: {{ LASER_START_X }}, y: {{ LASER_START_Y }}, angle: 0.5 };          let draggingObj = null;          let dragOffset = { x: 0, y: 0 };          class Mirror {              constructor(x, y, angle, length) {                  this.x = x;                  this.y = y;                  this.angle = angle;                  this.length = length;                  this.thickness = 12;              }              draw(ctx) {                  ctx.save();                  ctx.translate(this.x, this.y);                  ctx.rotate(this.angle);                  /* Shadow/Glow */                  ctx.shadowColor = '{{ ACCENT_COLOR }}';                  ctx.shadowBlur = 15;                  /* Mirror Body (3D-like gradient) */                  const grad = ctx.createLinearGradient(0, -this.thickness/2, 0, this.thickness/2);                  grad.addColorStop(0, '#ffffff');                  grad.addColorStop(0.3, '#a0a0a0');                  grad.addColorStop(0.7, '#404040');                  grad.addColorStop(1, '#111111');                  ctx.fillStyle = grad;                  ctx.beginPath();                  ctx.roundRect(-this.length/2, -this.thickness/2, this.length, this.thickness, 4);                  ctx.fill();                                                                                            /* Shine effect */                  ctx.strokeStyle = 'rgba(255,255,255,0.4)';                  ctx.lineWidth = 1;                  ctx.strokeRect(-this.length/2, -this.thickness/2, this.length, this.thickness);                  ctx.restore();              }              getBounds() {                  const cos = Math.cos(this.angle);                  const sin = Math.sin(this.angle);                  const x1 = this.x - (this.length / 2) * cos;                  const y1 = this.y - (this.length / 2) * sin;                  const x2 = this.x + (this.length / 2) * cos;                  const y2 = this.y + (this.length / 2) * sin;                  return { x1, y1, x2, y2 };              }          }          function init() {              resize();              mirrors = [                  new Mirror(width * 0.5, height * 0.3, 0.8, 150),                  new Mirror(width * 0.7, height * 0.6, 2.2, 150),                  new Mirror(width * 0.3, height * 0.7, -0.5, 150)              ];              animate();          }          function resize() {              width = canvas.width = window.innerWidth;              height = canvas.height = window.innerHeight;              laserSource.y = height / 2;          }          function intersect(x1, y1, x2, y2, x3, y3, x4, y4) {              const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);              if (den === 0) return null;              const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / den;              const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / den;              if (t > 0 && u > 0 && u < 1) {                  return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1), t };              }              return null;          }          function castLaser() {              let curX = laserSource.x;              let curY = laserSource.y;              let angle = laserSource.angle;              const points = [{ x: curX, y: curY }];                                                                          let maxReflections = {{ MAX_REFLECTIONS }};              while (maxReflections--) {                  const rayEndX = curX + Math.cos(angle) * 5000;                  const rayEndY = curY + Math.sin(angle) * 5000;                  let closest = null;                  let closestMirror = null;                  for (const mirror of mirrors) {                      const b = mirror.getBounds();                      const hit = intersect(curX, curY, rayEndX, rayEndY, b.x1, b.y1, b.x2, b.y2);                      if (hit && (!closest || hit.t < closest.t)) {                          closest = hit;                          closestMirror = mirror;                      }                  }                  if (closest) {                      points.push({ x: closest.x, y: closest.y });                      /* Calculate reflection angle */                      const mirrorAngle = closestMirror.angle;                      angle = 2 * mirrorAngle - angle;                      curX = closest.x + Math.cos(angle) * 0.01; /* nudge */                      curY = closest.y + Math.sin(angle) * 0.01;                  } else {                      points.push({ x: rayEndX, y: rayEndY });                      break;                  }              }              return points;          }          function drawLaser(points) {              ctx.save();              ctx.shadowBlur = 15;              ctx.shadowColor = '{{ LASER_COLOR_CORE }}';              ctx.strokeStyle = '{{ LASER_COLOR_STROKE }}';              ctx.lineWidth = 3;              ctx.lineCap = 'round';              ctx.lineJoin = 'round';                                                                          ctx.beginPath();              ctx.moveTo(points[0].x, points[0].y);              for (let i = 1; i < points.length; i++) {                  ctx.lineTo(points[i].x, points[i].y);              }              ctx.stroke();              /* Inner Core */              ctx.strokeStyle = '#ffffff';              ctx.lineWidth = 1;              ctx.shadowBlur = 0;              ctx.stroke();              /* Source point */              ctx.fillStyle = '{{ LASER_COLOR_CORE }}';              ctx.beginPath();              ctx.arc(points[0].x, points[0].y, 8, 0, Math.PI * 2);              ctx.fill();                                                                          ctx.restore();          }          function animate() {              ctx.clearRect(0, 0, width, height);                                                                          /* Draw Grid (BG) */              ctx.strokeStyle = '{{ GRID_COLOR }}';              ctx.lineWidth = 1;              for(let i=0; i<width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,height); ctx.stroke(); }              for(let i=0; i<height; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(width,i); ctx.stroke(); }              const path = castLaser();              drawLaser(path);              mirrors.forEach(m => m.draw(ctx));              requestAnimationFrame(animate);          }          /* Interaction */          window.addEventListener('mousedown', e => {              const mx = e.clientX;              const my = e.clientY;                                                                          /* Check laser source */              const distLaser = Math.hypot(mx - laserSource.x, my - laserSource.y);              if (distLaser < 20) {                  draggingObj = laserSource;                  dragOffset = { x: mx - laserSource.x, y: my - laserSource.y };                  return;              }              /* Check mirrors */              for (const m of mirrors) {                  const dist = Math.hypot(mx - m.x, my - m.y);                  if (dist < m.length / 2) {                      draggingObj = m;                      dragOffset = { x: mx - m.x, y: my - m.y };                      return;                  }              }          });          window.addEventListener('mousemove', e => {              if (!draggingObj) return;              draggingObj.x = e.clientX - dragOffset.x;              draggingObj.y = e.clientY - dragOffset.y;                                                                          /* For the laser, we can adjust angle if dragging a separate handle,                 but here let's just make it look at the center of screen slightly                 if (draggingObj === laserSource) {                      laserSource.angle += 0.01; // optional                 } */          });          window.addEventListener('mouseup', () => draggingObj = null);          window.addEventListener('wheel', e => {              const mx = e.clientX;              const my = e.clientY;              for (const m of mirrors) {                  const dist = Math.hypot(mx - m.x, my - m.y);                  if (dist < m.length / 2) {                      m.angle += e.deltaY * 0.002;                      e.preventDefault();                  }              }              if (Math.hypot(mx - laserSource.x, my - laserSource.y) < 20) {                  laserSource.angle += e.deltaY * 0.002;                  e.preventDefault();              }          }, { passive: false });          window.addEventListener('resize', resize);          init();      </script>  </body>  </html>
