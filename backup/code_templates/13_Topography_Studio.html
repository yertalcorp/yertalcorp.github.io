<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Ethereal Noise Peaks</title>     <style>         body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }         #ui-container {             position: absolute;             top: 20px;             left: 20px;             z-index: 100;             pointer-events: none;         }         .label {             color: white;             background: rgba(0, 0, 0, 0.6);             padding: 10px 15px;             border-radius: 8px;             backdrop-filter: blur(5px);             border: 1px solid rgba(255, 255, 255, 0.1);             pointer-events: auto;         }         canvas { display: block; }     </style> </head> <body>     <div id="ui-container">         <div class="label">             <h2 style="margin:0; font-size: 18px;">Ethereal Terrain</h2>             <p style="margin:5px 0 0; font-size: 12px; opacity: 0.8;">Use the GUI to manipulate the landscape.</p>         </div>     </div>      <script type="importmap">         {             "imports": {                 "three": "https://unpkg.com/three@0.160.0/build/three.module.js",                 "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",                 "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"             }         }     </script>      <script type="module">         import * as THREE from 'three';         import { OrbitControls } from 'three/addons/controls/OrbitControls.js';         import GUI from 'lil-gui';          /* --- Perlin Noise Implementation --- */         const perlin = {             p: new Uint8Array(512),             permutation: [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190, 6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168, 68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54, 65,25,63,161, 1,216,80,73,209,76,132,187,208, 89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186, 3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152, 2,44,154,163, 70,221,153,101,155,167, 43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241, 81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184, 84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180],             init: function() {                 for (let i = 0; i < 256; i++) this.p[i] = this.p[i + 256] = this.permutation[i];             },             lerp: (t, a, b) => a + t * (b - a),             fade: t => t * t * t * (t * (t * 6 - 15) + 10),             grad: (hash, x, y, z) => {                 const h = hash & 15;                 const u = h < 8 ? x : y;                 const v = h < 4 ? y : h === 12 || h === 14 ? x : z;                 return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);             },             noise: function(x, y, z) {                 const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;                 x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);                 const u = this.fade(x), v = this.fade(y), w = this.fade(z);                 const A = this.p[X] + Y, AA = this.p[A] + Z, AB = this.p[A + 1] + Z, B = this.p[X + 1] + Y, BA = this.p[B] + Z, BB = this.p[B + 1] + Z;                 return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z), this.grad(this.p[BA], x - 1, y, z)), this.lerp(u, this.grad(this.p[AB], x, y - 1, z), this.grad(this.p[BB], x - 1, y - 1, z))), this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1), this.grad(this.p[BA + 1], x - 1, y, z - 1)), this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1), this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));             }         };         perlin.init();          /* --- Scene Setup --- */         const scene = new THREE.Scene();         scene.background = new THREE.Color(0x050508);         scene.fog = new THREE.FogExp2(0x050508, 0.002);          const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);         camera.position.set(250, 200, 250);          const renderer = new THREE.WebGLRenderer({ antialias: true });         renderer.setSize(window.innerWidth, window.innerHeight);         renderer.setPixelRatio(window.devicePixelRatio);         document.body.appendChild(renderer.domElement);          const controls = new OrbitControls(camera, renderer.domElement);         controls.enableDamping = true;          /* --- Lighting --- */         const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);         scene.add(ambientLight);          const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);         sunLight.position.set(100, 200, 100);         scene.add(sunLight);          /* --- Landscape Logic --- */         const params = {             size: {{size}},             segments: {{segments}},             scale: {{scale}},             height: {{height}},             speed: {{speed}},             offset: {{offset}},             wireframe: {{wireframe}},             colorSea: "{{colorsea}}",             colorSand: "{{colorsand}}",             colorGrass: "{{colorgrass}}",             colorRock: "{{colorrock}}",             colorSnow: "{{colorsnow}}"         };          const geometry = new THREE.PlaneGeometry(params.size, params.size, params.segments, params.segments);         geometry.rotateX(-Math.PI / 2);          const material = new THREE.MeshPhongMaterial({             vertexColors: true,             flatShading: true,             shininess: 0,             wireframe: params.wireframe         });          const terrain = new THREE.Mesh(geometry, material);         scene.add(terrain);          function updateTerrain() {             const pos = geometry.attributes.position;             const colors = [];             const color = new THREE.Color();              for (let i = 0; i < pos.count; i++) {                 const x = pos.getX(i);                 const z = pos.getZ(i);                                  /* Multi-layered noise for more realism */                 let h = perlin.noise(x * params.scale, z * params.scale, params.offset) * 1.0;                 h += perlin.noise(x * params.scale * 2.1, z * params.scale * 2.1, params.offset) * 0.5;                 h += perlin.noise(x * params.scale * 4.3, z * params.scale * 4.3, params.offset) * 0.25;                 h = (h + 1) / 2; /* Normalize to 0-1 */                  const actualHeight = Math.pow(h, 1.5) * params.height;                 pos.setY(i, actualHeight);                  /* Color Grading */                 if (h < 0.25) {                     color.set(params.colorSea);                 } else if (h < 0.32) {                     color.set(params.colorSand);                 } else if (h < 0.55) {                     color.set(params.colorGrass);                 } else if (h < 0.75) {                     color.set(params.colorRock);                 } else {                     color.set(params.colorSnow);                 }                 colors.push(color.r, color.g, color.b);             }              geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));             pos.needsUpdate = true;             geometry.computeVertexNormals();         }          /* --- GUI --- */         const gui = new GUI();         const terrainFolder = gui.addFolder('Terrain Geometry');         terrainFolder.add(params, 'scale', 0.001, 0.02).name('Noise Scale').onChange(updateTerrain);         terrainFolder.add(params, 'height', 10, 300).name('Max Height').onChange(updateTerrain);         terrainFolder.add(params, 'speed', 0, 1).name('Flow Speed');         terrainFolder.add(params, 'wireframe').onChange(v => material.wireframe = v);                          const colorFolder = gui.addFolder('Biomes');         colorFolder.addColor(params, 'colorSea').name('Ocean').onChange(updateTerrain);         colorFolder.addColor(params, 'colorSand').name('Beach').onChange(updateTerrain);         colorFolder.addColor(params, 'colorGrass').name('Forest').onChange(updateTerrain);         colorFolder.addColor(params, 'colorRock').name('Mountain').onChange(updateTerrain);         colorFolder.addColor(params, 'colorSnow').name('Summit').onChange(updateTerrain);          /* --- Animation Loop --- */         function animate() {             requestAnimationFrame(animate);                                      if (params.speed > 0) {                 params.offset += 0.01 * params.speed;                 updateTerrain();             }             controls.update();             renderer.render(scene, camera);         }          window.addEventListener('resize', () => {             camera.aspect = window.innerWidth / window.innerHeight;             camera.updateProjectionMatrix();             renderer.setSize(window.innerWidth, window.innerHeight);         });          updateTerrain();         animate();     </script> </body> </html>
