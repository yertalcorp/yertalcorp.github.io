<!DOCTYPE html><html><head><style>  body { background: #050505; color: #00f2ff; font-family: 'Courier New', monospace; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }  .app-wrap { width: 90vw; height: 80vh; display: flex; gap: 20px; padding: 20px; background: rgba(0, 0, 0, 0.9); border: 1px solid #00f2ff; box-shadow: 0 0 15px #00f2ff, inset 0 0 15px #00f2ff; position: relative; }  .grid-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(0, 242, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.1) 1px, transparent 1px); background-size: 30px 30px; pointer-events: none; z-index: 0; }  .editor, .monitor { flex: 1; z-index: 1; display: flex; flex-direction: column; }  textarea { flex: 1; background: transparent; border: 2px solid #ff00ff; border-radius: 4px; color: #fff; padding: 20px; font-size: 1.5rem; resize: none; outline: none; box-shadow: 0 0 10px #ff00ff; line-height: 1.6; }  .monitor { padding: 20px; gap: 20px; }  .line-stat { display: flex; align-items: center; justify-content: space-between; padding: 15px; border: 1px solid #00f2ff; background: rgba(0, 242, 255, 0.05); }  .count-circle { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; transition: 0.3s; }  .valid { background: #00f2ff; color: #000; box-shadow: 0 0 20px #00f2ff; }  .invalid { border: 2px solid #ff00ff; color: #ff00ff; box-shadow: 0 0 10px #ff00ff; }  .target { font-size: 0.8rem; color: #aaa; margin-top: 5px; }  .label { text-transform: uppercase; letter-spacing: 2px; }</style></head><body><div class="app-wrap">  <div class="grid-bg"></div>  <div class="editor">    <textarea id="tx" placeholder="Enter Haiku...&#10;Line 1&#10;Line 2&#10;Line 3"></textarea>  </div>  <div class="monitor" id="mo"></div></div><script>const params = {    SIDE_BY_SIDE: "{{side_by_side}}",     HAIKU_WORKBENCH: "{{haiku_workbench}}",     SYLLABLE_COUNTS: [5,  7,  5],     NEON_WRITING_GRID: "{{neon_writing_grid}}",   };  const el = document.getElementById('tx');  const mn = document.getElementById('mo');  const syl = (w) => {    w = w.toLowerCase().replace(/[^a-z]/g,  '');    if (w.length <= 3) return 1;    w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');    w = w.replace(/^y/, '');    const m = w.match(/[aeiouy]{1, 2}/g);    return m ? m.length : 0;  };  const lSyl = (l) => {    return l.split(/\s+/).filter(x => x).reduce((a,  b) => a + syl(b),  0);  };  const upd = () => {    const lines = el.value.split('\n');    mn.innerHTML = '';    for (let i = 0; i < 3; i++) {      const c = lSyl(lines[i] || "");      const t = params.SYLLABLE_COUNTS[i];      const ok = c === t;      const row = document.createElement('div');      row.className = 'line-stat';      row.innerHTML = `        <div>          <div class="label">Line ${i + 1}</div>          <div class="target">Goal: ${t}</div>        </div>        <div class="count-circle ${ok ? 'valid' : 'invalid'}">${c}</div>      `;      mn.appendChild(row);    }  };  el.addEventListener('input', upd);  upd();</script></body></html>
