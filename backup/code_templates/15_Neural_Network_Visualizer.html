<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Neural Network</title>     <style>         body, html {             margin: 0;             overflow: hidden;             height: 100%;             background: linear-gradient(135deg, #1a0f28 0%, #0a081a 100%);             font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;             color: #eee;         }         canvas {             display: block;             background: transparent;         }         #info {             position: absolute;             top: 10px;             left: 10px;             background: rgba(0, 0, 0, 0.5);             padding: 10px 20px;             border-radius: 8px;             border: 1px solid {{edge_color}};             font-size: 0.9em;             z-index: 10;             box-shadow: 0 0 15px rgba(0, 255, 203, 0.2);         }         #info h1 {             margin: 0 0 5px 0;             color: {{signal_color}};             font-size: 1.2em;         }         #info p {             margin: 0;             color: #bbb;         }     </style> </head> <body>     <canvas id="networkCanvas"></canvas>     <div id="info">         <h1>Neural Network</h1>         <p>Click a node to send out a signal pulse!</p>     </div>     <script>         (function() {             const canvas = document.getElementById('networkCanvas');             const ctx = canvas.getContext('2d');              /* --- Configuration Constants via Template Injectors --- */             const NUM_NODES = parseInt("{{num_nodes}}", 10) || 25;             const NODE_RADIUS_BASE = parseFloat("{{node_radius_base}}") || 15;             const NODE_COLOR_PRIMARY = "{{node_color_primary}}";             const NODE_COLOR_SECONDARY = "{{node_color_secondary}}";             const NODE_HIGHLIGHT_COLOR = "{{node_highlight_color}}";             const EDGE_COLOR = "{{edge_color}}";             const SIGNAL_COLOR = "{{signal_color}}";             const SIGNAL_SPEED = parseFloat("{{signal_speed}}") || 0.03;             const Z_SCALE_FACTOR = parseFloat("{{z_scale_factor}}") || 0.4;             const Z_Y_OFFSET_FACTOR = parseFloat("{{z_y_offset_factor}}") || 50;              const SIGNAL_RADIUS_BASE = 5;             const MAX_Z = 1;              const NODE_PULSE_DURATION = 15;              const NODE_MIN_CONNECTIONS = 1;             const NODE_MAX_CONNECTIONS = 4;              /* --- Global Runtime State --- */             let nodes = [];             let edges = [];             let activeSignals = [];             let animationFrameId = null;              /* --- Utility Functions --- */             function resizeCanvas() {                 canvas.width = window.innerWidth;                 canvas.height = window.innerHeight;                 if (animationFrameId) {                     cancelAnimationFrame(animationFrameId);                 }                 init();             }              /* --- Classes --- */             class Node {                 constructor(id, x, y, z) {                     this.id = id;                     this.x = x;                     this.y = y;                     this.z = z; /* 0 (front) to 1 (back) */                     this.radius = NODE_RADIUS_BASE;                     this.connections = []; /* Array of Node objects */                     this.pulseTimer = 0; /* Countdown for pulse highlight */                 }                  get projectedPosition() {                     /* Deeper nodes are smaller and higher on screen (visual perspective) */                     const scaledRadius = this.radius * (1 - this.z * Z_SCALE_FACTOR);                     const offsetY = this.z * Z_Y_OFFSET_FACTOR;                     /* Add a subtle sine wave motion to Y for organic feel */                     const jitterX = Math.sin(Date.now() * 0.0005 + this.id * 10) * 5;                     const jitterY = Math.cos(Date.now() * 0.0007 + this.id * 10) * 5;                     return {                         x: this.x + jitterX,                         y: this.y - offsetY + jitterY,                         radius: scaledRadius,                         z: this.z /* Keep z for sorting */                     };                 }                  draw(ctx) {                     const p = this.projectedPosition;                     const currentRadius = p.radius + (this.pulseTimer > 0 ? (NODE_RADIUS_BASE * 0.5 * (this.pulseTimer / NODE_PULSE_DURATION)) : 0);                                          ctx.save();                     /* Node body - Radial gradient for 3D orb effect */                     const gradient = ctx.createRadialGradient(p.x - currentRadius * 0.3, p.y - currentRadius * 0.3, 0, p.x, p.y, currentRadius);                     gradient.addColorStop(0, this.pulseTimer > 0 ? NODE_HIGHLIGHT_COLOR : NODE_COLOR_PRIMARY + 'FF');                     gradient.addColorStop(0.7, NODE_COLOR_SECONDARY + 'EE');                     gradient.addColorStop(1, NODE_COLOR_SECONDARY + 'BB');                                          ctx.beginPath();                     ctx.arc(p.x, p.y, currentRadius, 0, Math.PI * 2);                     ctx.fillStyle = gradient;                     ctx.fill();                                          /* Node glow (shadow) */                     ctx.shadowBlur = currentRadius * 0.8;                     ctx.shadowColor = this.pulseTimer > 0 ? NODE_HIGHLIGHT_COLOR : NODE_COLOR_PRIMARY;                     ctx.fillStyle = gradient;                     ctx.fill(); /* Fill again to apply shadow */                     ctx.restore();                 }             }              class Signal {                 constructor(fromNode, toNode, color, speed) {                     this.fromNode = fromNode;                     this.toNode = toNode;                     this.progress = 0; /* 0 to 1 */                     this.color = color;                     this.speed = speed;                     this.id = Math.random(); /* Unique ID for filtering */                 }                  update() {                     this.progress += this.speed;                 }                  draw(ctx) {                     if (this.progress > 1) return;                     const start = this.fromNode.projectedPosition;                     const end = this.toNode.projectedPosition;                                          /* Calculate current position along the path */                     const currentX = start.x + (end.x - start.x) * this.progress;                     const currentY = start.y + (end.y - start.y) * this.progress;                                          /* Interpolate Z for current position */                     const currentZ = this.fromNode.z + (this.toNode.z - this.fromNode.z) * this.progress;                     const signalRadius = SIGNAL_RADIUS_BASE * (1 - currentZ * Z_SCALE_FACTOR);                                          ctx.save();                     ctx.beginPath();                     ctx.arc(currentX, currentY, signalRadius, 0, Math.PI * 2);                                          /* Apply a radial gradient for a glow effect */                     const gradient = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, signalRadius);                     gradient.addColorStop(0, this.color + 'FF'); /* Fully opaque center */                     gradient.addColorStop(0.8, this.color + '80'); /* Semi-transparent towards edge */                     gradient.addColorStop(1, this.color + '00'); /* Fully transparent at edge */                     ctx.fillStyle = gradient;                     ctx.fill();                                          /* Add a subtle shadow/glow to the signal itself */                     ctx.shadowBlur = signalRadius * 2;                     ctx.shadowColor = this.color;                     ctx.fillStyle = gradient;                     ctx.fill(); /* Fill again for shadow */                     ctx.restore();                 }             }              /* --- Network Generation --- */             function generateNodesAndEdges() {                 nodes = [];                 edges = [];                 for (let i = 0; i < NUM_NODES; i++) {                     const x = Math.random() * canvas.width;                     const y = Math.random() * canvas.height;                     const z = Math.random() * MAX_Z; /* Z from 0 (front) to 1 (back) */                     nodes.push(new Node(i, x, y, z));                 }                  /* Connect nodes */                 for (let i = 0; i < NUM_NODES; i++) {                     const node1 = nodes[i];                     const numConnections = Math.floor(Math.random() * (NODE_MAX_CONNECTIONS - NODE_MIN_CONNECTIONS + 1)) + NODE_MIN_CONNECTIONS;                     while (node1.connections.length < numConnections) {                         const node2 = nodes[Math.floor(Math.random() * NUM_NODES)];                         /* Avoid self-loops and duplicate connections */                         if (node1 !== node2 && !node1.connections.includes(node2)) {                             node1.connections.push(node2);                             node2.connections.push(node1); /* For undirected graph */                             edges.push({ from: node1, to: node2 });                         }                     }                 }             }              /* --- Drawing Functions --- */             function drawEdges() {                 /* Sort edges by the average Z of their connected nodes, draw further back first */                 const sortedEdges = [...edges].sort((a, b) => (b.from.z + b.to.z) / 2 - (a.from.z + a.to.z) / 2);                 ctx.beginPath();                 ctx.strokeStyle = EDGE_COLOR;                 ctx.lineWidth = 1.5; /* Slightly thicker lines */                 ctx.shadowBlur = 5; /* Subtle glow for edges */                 ctx.shadowColor = EDGE_COLOR;                 sortedEdges.forEach(edge => {                     const p1 = edge.from.projectedPosition;                     const p2 = edge.to.projectedPosition;                     ctx.moveTo(p1.x, p1.y);                     ctx.lineTo(p2.x, p2.y);                 });                 ctx.stroke();                 ctx.shadowBlur = 0; /* Reset shadow after drawing edges */             }              function drawNodes() {                 /* Sort nodes by Z, draw further back first */                 const sortedNodes = [...nodes].sort((a, b) => b.z - a.z);                 sortedNodes.forEach(node => node.draw(ctx));             }              function drawSignals() {                 activeSignals.forEach(signal => signal.draw(ctx));             }              /* --- Animation Loop --- */             function update() {                 /* Update signals */                 activeSignals = activeSignals.filter(signal => {                     signal.update();                     return signal.progress < 1;                 });                  /* Update node pulse timers */                 nodes.forEach(node => {                     if (node.pulseTimer > 0) {                         node.pulseTimer--;                     }                 });             }              function draw() {                 ctx.clearRect(0, 0, canvas.width, canvas.height);                 drawEdges();                 drawNodes();                 drawSignals();             }              function animate() {                 update();                 draw();                 animationFrameId = requestAnimationFrame(animate);             }              /* --- Event Handling --- */             canvas.addEventListener('mousedown', (e) => {                 const clickX = e.clientX;                 const clickY = e.clientY;                 /* Check for clicked node (iterate front to back for correct hit detection on overlapping nodes) */                 const sortedNodes = [...nodes].sort((a, b) => a.z - b.z); /* Sort front to back */                 for (const node of sortedNodes) {                     const p = node.projectedPosition;                     const dx = clickX - p.x;                     const dy = clickY - p.y;                     if (dx * dx + dy * dy < p.radius * p.radius) {                         /* Node clicked! */                         node.pulseTimer = NODE_PULSE_DURATION; /* Start pulse animation */                         /* Send signals to all connected nodes */                         node.connections.forEach(connectedNode => {                             activeSignals.push(new Signal(node, connectedNode, SIGNAL_COLOR, SIGNAL_SPEED));                         });                         return; /* Only process one click */                     }                 }             });              /* --- Initialization --- */             function init() {                 generateNodesAndEdges();                 if (animationFrameId) {                     cancelAnimationFrame(animationFrameId);                 }                 animate();             }              window.addEventListener('resize', resizeCanvas);             resizeCanvas(); /* Initial setup */         })();     </script> </body> </html>
