<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Canvas Doodling Lab</title><style>  body { margin: 0; background: {{BACKGROUND_GRADIENT_START}}; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }  #canvas-container { position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.1); }  canvas { background: linear-gradient(135deg, {{BACKGROUND_GRADIENT_START}}, {{BACKGROUND_GRADIENT_MID}}, {{BACKGROUND_GRADIENT_END}}); display: block; }  .toolbar { margin-bottom: 20px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 50px; backdrop-filter: blur(10px); display: flex; gap: 15px; align-items: center; border: 1px solid rgba(255,255,255,0.2); }  .toolbar-group { display: flex; align-items: center; gap: 5px; color: rgba(255,255,255,0.8); font-size: 0.8rem; font-weight: bold; }  button { padding: 8px 20px; border-radius: 20px; border: none; cursor: pointer; background: {{BUTTON_COLOR_PRIMARY}}; color: white; font-weight: bold; transition: 0.3s; }  button:hover { transform: scale(1.1); box-shadow: 0 0 15px {{BUTTON_COLOR_PRIMARY}}; }  button.active { background: {{BUTTON_COLOR_ACTIVE}} !important; color: #000; box-shadow: 0 0 15px {{BUTTON_COLOR_ACTIVE}}; }  input[type=range] { cursor: pointer; }</style></head><body><div class="toolbar">  <div class="toolbar-group">    <span>Draw:</span><input type="color" id="colorPicker" value="{{DEFAULT_BRUSH_COLOR}}">  </div>  <div class="toolbar-group">    <span>Fill:</span><input type="color" id="fillPicker" value="{{DEFAULT_FILL_COLOR}}">  </div>  <div class="toolbar-group" style="flex-direction: column; gap: 2px;">    <span>Size</span>    <input type="range" id="brushSize" min="{{MIN_BRUSH_SIZE}}" max="{{MAX_BRUSH_SIZE}}" value="{{DEFAULT_BRUSH_SIZE}}">  </div>  <button id="drawBtn" class="active" onclick="setMode('draw')">Draw</button>  <button id="fillBtn" onclick="setMode('fill')">Fill</button>  <button id="eraseBtn" onclick="setMode('erase')">Erase</button>  <button onclick="undo()">Undo</button>  <button onclick="clearCanvas()" style="background:{{BUTTON_COLOR_CLEAR}}">Clear</button></div><div id="canvas-container">  <canvas id="paintBoard" width="{{CANVAS_WIDTH}}" height="{{CANVAS_HEIGHT}}"></canvas></div><script>  const canvas = document.getElementById('paintBoard');  const ctx = canvas.getContext('2d');  let painting = false;  let currentMode = 'draw';  let history = [];  function updateCursor() {    if (currentMode === 'fill') {      const fillSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M19 2c0-1.103-.897-2-2-2H7c-1.103 0-2 .897-2 2v3h14V2zM3 6v4c0 3.121 2.001 5.779 4.793 6.643l.635 5.714C8.528 23.238 9.356 24 10.243 24h3.515c.887 0 1.715-.762 1.815-1.643l.635-5.714C18.999 15.779 21 13.121 21 10V6H3zm11 8h-4v-2h4v2z" fill="${encodeURIComponent(document.getElementById('fillPicker').value)}"/></svg>`;      canvas.style.cursor = `url('data:image/svg+xml;utf8,${fillSvg}') 12 22, cell`;    } else if (currentMode === 'erase') {      const eraserSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="8" fill="none" stroke="#000" stroke-width="1"/></svg>`;      canvas.style.cursor = `url('data:image/svg+xml;utf8,${eraserSvg}') 12 12, pointer`;    } else {      const color = document.getElementById('colorPicker').value;      const pencilSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M7.127 22.564l-5.116 1.436 1.436-5.116 13.514-13.513 3.68 3.68-13.514 13.513zm15.417-15.416l-2.553-2.553 1.436-1.436 2.552 2.552-1.435 1.437z" fill="${encodeURIComponent(color)}"/></svg>`;      canvas.style.cursor = `url('data:image/svg+xml;utf8,${pencilSvg}') 2 22, crosshair`;    }  }  document.getElementById('brushSize').addEventListener('input', updateCursor);  document.getElementById('colorPicker').addEventListener('input', updateCursor);  document.getElementById('fillPicker').addEventListener('input', updateCursor);  function setMode(mode) {    currentMode = mode;    document.getElementById('drawBtn').classList.toggle('active', mode === 'draw');    document.getElementById('fillBtn').classList.toggle('active', mode === 'fill');    document.getElementById('eraseBtn').classList.toggle('active', mode === 'erase');    updateCursor();  }  function getCoordinates(e) {    const rect = canvas.getBoundingClientRect();    const scaleX = canvas.width / rect.width;    const scaleY = canvas.height / rect.height;    if (currentMode === 'draw') {      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };    }    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY - 10 };  }  function saveState() { history.push(canvas.toDataURL()); }  function start(e) {    if (currentMode === 'fill') return;    painting = true;    saveState();    draw(e);  }  function stop() { painting = false; ctx.beginPath(); }  function draw(e) {    if (!painting || currentMode === 'fill') return;    ctx.globalCompositeOperation = (currentMode === 'erase') ? 'destination-out' : 'source-over';    const coords = getCoordinates(e);    ctx.lineWidth = document.getElementById('brushSize').value;    ctx.lineCap = 'round';    ctx.strokeStyle = document.getElementById('colorPicker').value;    ctx.lineTo(coords.x, coords.y);    ctx.stroke();    ctx.beginPath();    ctx.moveTo(coords.x, coords.y);  }  function handleCanvasClick(e) {    if (currentMode !== 'fill') return;    saveState();    const coords = getCoordinates(e);    const targetColor = document.getElementById('fillPicker').value;    executeFloodFill(Math.floor(coords.x), Math.floor(coords.y), targetColor);  }  function executeFloodFill(startX, startY, fillHex) {    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);    const data = imgData.data;    const targetR = parseInt(fillHex.slice(1,3), 16);    const targetG = parseInt(fillHex.slice(3,5), 16);    const targetB = parseInt(fillHex.slice(5,7), 16);    const startPos = (startY * canvas.width + startX) * 4;    const startR = data[startPos];    const startG = data[startPos+1];    const startB = data[startPos+2];    const startA = data[startPos+3];    if (startR === targetR && startG === targetG && startB === targetB && startA === 255) return;    const queue = [[startX, startY]];    while (queue.length > 0) {      const [x, y] = queue.pop();      const pos = (y * canvas.width + x) * 4;      if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {        if (data[pos] === startR && data[pos+1] === startG && data[pos+2] === startB && data[pos+3] === startA) {          data[pos] = targetR;          data[pos+1] = targetG;          data[pos+2] = targetB;          data[pos+3] = 255;          queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);        }      }    }    ctx.putImageData(imgData, 0, 0);  }  function undo() {    if (history.length > 0) {      let img = new Image();      img.src = history.pop();      img.onload = () => {        const prevMode = ctx.globalCompositeOperation;        ctx.globalCompositeOperation = 'source-over';        ctx.clearRect(0,0, canvas.width, canvas.height);        ctx.drawImage(img, 0, 0);        ctx.globalCompositeOperation = prevMode;      };    }  }  function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); history = []; }  canvas.addEventListener('mousedown', start);  canvas.addEventListener('mouseup', stop);  canvas.addEventListener('mousemove', draw);  canvas.addEventListener('click', handleCanvasClick);  const orb = document.createElement('div');  orb.style = "position:absolute; width:100px; height:100px; background: radial-gradient(circle at 30% 30%, {{AMBIENT_GLOW_COLOR_A}}, {{AMBIENT_GLOW_COLOR_B}}); border-radius: 50%; filter: blur(40px); z-index: -1; animation: float 5s infinite alternate;";  document.body.appendChild(orb);  updateCursor();</script><style>  @keyframes float { from { transform: translateY(-100px); } to { transform: translateY(100px); } }</style></body></html>
