<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>3D Cellular Automata Island Biome</title>     <style>         body {             margin: 0;             overflow: hidden;             background: #050b14;             font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;             color: #fff;         }         #canvas-container {             width: 100vw;             height: 100vh;         }         #ui-panel {             position: absolute;             top: 20px;             left: 20px;             width: 280px;             background: rgba(10, 18, 30, 0.85);             backdrop-filter: blur(10px);             border: 1px solid rgba(255, 255, 255, 0.1);             border-radius: 12px;             padding: 16px;             box-shadow: 0 10px 30px rgba(0,0,0,0.5);         }         h2 {             margin: 0 0 12px 0;             font-size: 16px;             text-transform: uppercase;             letter-spacing: 1px;             color: #4da6ff;         }         .control-group {             margin-bottom: 12px;         }         label {             display: flex;             justify-content: space-between;             font-size: 12px;             margin-bottom: 4px;             color: #ccc;         }         input[type=range] {             width: 100%;             accent-color: #4da6ff;         }         button {             width: 100%;             background: #4da6ff;             border: none;             color: #fff;             padding: 10px;             border-radius: 6px;             font-weight: bold;             cursor: pointer;             transition: background 0.2s;             margin-top: 8px;         }         button:hover {             background: #2b82d9;         }     </style>     <!-- Three.js & OrbitControls -->     <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> </head> <body>     <div id="canvas-container"></div>      <div id="ui-panel">         <h2>Biome Generator</h2>         <div class="control-group">             <label>CA Iterations <span id="val-ca">4</span></label>             <input type="range" id="param-ca" min="1" max="10" value="4">         </div>         <div class="control-group">             <label>Initial Density <span id="val-density">0.55</span></label>             <input type="range" id="param-density" min="0.3" max="0.8" step="0.05" value="0.55">         </div>         <div class="control-group">             <label>Mountain Height <span id="val-height">18</span></label>             <input type="range" id="param-height" min="5" max="40" value="18">         </div>         <div class="control-group">             <label>Water Level <span id="val-water">2.5</span></label>             <input type="range" id="param-water" min="0" max="10" step="0.5" value="2.5">         </div>         <button id="btn-generate">Regenerate Island</button>     </div>      <script>         const GRID_SIZE = 128;                  // --- THREE.JS SETUP ---         const container = document.getElementById('canvas-container');         const scene = new THREE.Scene();         scene.background = new THREE.Color(0x0a121e);         scene.fog = new THREE.FogExp2(0x0a121e, 0.005);          const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);         camera.position.set(0, 100, 140);          const renderer = new THREE.WebGLRenderer({ antialias: true });         renderer.setSize(window.innerWidth, window.innerHeight);         renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));         renderer.shadowMap.enabled = true;         container.appendChild(renderer.domElement);          const controls = new THREE.OrbitControls(camera, renderer.domElement);         controls.enableDamping = true;         controls.maxPolarAngle = Math.PI / 2 - 0.05;          // --- LIGHTS ---         const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);         scene.add(ambientLight);          const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);         sunLight.position.set(80, 120, 60);         sunLight.castShadow = true;         sunLight.shadow.mapSize.width = 2048;         sunLight.shadow.mapSize.height = 2048;         scene.add(sunLight);          // --- WATER MESH ---         const waterGeo = new THREE.PlaneGeometry(GRID_SIZE * 1.5, GRID_SIZE * 1.5);         const waterMat = new THREE.MeshPhongMaterial({             color: 0x006699,             transparent: true,             opacity: 0.75,             shininess: 90,             flatShading: true         });         const waterMesh = new THREE.Mesh(waterGeo, waterMat);         waterMesh.rotation.x = -Math.PI / 2;         scene.add(waterMesh);          // --- TERRAIN MESH SETUP ---         const terrainGeo = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE, GRID_SIZE - 1, GRID_SIZE - 1);         terrainGeo.rotateX(-Math.PI / 2);          const terrainMat = new THREE.MeshStandardMaterial({             vertexColors: true,             roughness: 0.8,             metalness: 0.1,             flatShading: true         });          const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);         terrainMesh.receiveShadow = true;         terrainMesh.castShadow = true;         scene.add(terrainMesh);          // --- CELLULAR AUTOMATA LOGIC ---         function generateHeightmap(caSteps, initialDensity, maxElevation) {             let grid = Array(GRID_SIZE).fill().map((_, y) =>                  Array(GRID_SIZE).fill().map((_, x) => {                     const distFromCenter = Math.sqrt((x - GRID_SIZE/2)**2 + (y - GRID_SIZE/2)**2);                     const maxDist = GRID_SIZE / 2;                     const falloff = Math.max(0, 1 - (distFromCenter / maxDist) ** 1.8);                     return Math.random() < (initialDensity * falloff) ? 1 : 0;                 })             );              // CA Smoothing Passes             for (let step = 0; step < caSteps; step++) {                 let nextGrid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));                 for (let y = 0; y < GRID_SIZE; y++) {                     for (let x = 0; x < GRID_SIZE; x++) {                         let neighbors = 0;                         for (let oy = -1; oy <= 1; oy++) {                             for (let ox = -1; ox <= 1; ox++) {                                 const ny = y + oy, nx = x + ox;                                 if (ny >= 0 && ny < GRID_SIZE && nx >= 0 && nx < GRID_SIZE) {                                     neighbors += grid[ny][nx];                                 }                             }                         }                         nextGrid[y][x] = neighbors >= 5 ? 1 : 0;                     }                 }                 grid = nextGrid;             }              // Elevation diffusion via neighbor summation             let heightmap = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));             for (let pass = 0; pass < 8; pass++) {                 for (let y = 0; y < GRID_SIZE; y++) {                     for (let x = 0; x < GRID_SIZE; x++) {                         if (grid[y][x] === 1) {                             let count = 0;                             for (let oy = -1; oy <= 1; oy++) {                                 for (let ox = -1; ox <= 1; ox++) {                                     const ny = y + oy, nx = x + ox;                                     if (ny >= 0 && ny < GRID_SIZE && nx >= 0 && nx < GRID_SIZE && grid[ny][nx] === 1) {                                         count++;                                     }                                 }                             }                             if (count === 9) heightmap[y][x] += 1;                         }                     }                 }             }              // Normalize and scale             for (let y = 0; y < GRID_SIZE; y++) {                 for (let x = 0; x < GRID_SIZE; x++) {                     heightmap[y][x] = (heightmap[y][x] / 8) * maxElevation;                 }             }              return heightmap;         }          // --- COLOR BIOME MAPPING ---         function getBiomeColor(height, maxH) {             const normH = height / maxH;             const color = new THREE.Color();              if (normH < 0.05)      color.setHex(0xd2b48c); // Sand             else if (normH < 0.25) color.setHex(0x4a8b3b); // Lowland Forest             else if (normH < 0.55) color.setHex(0x2d6124); // Dense Jungle             else if (normH < 0.80) color.setHex(0x6e6e6e); // Mountain Rock             else                   color.setHex(0xf0f5f5); // Snow Peak              return color;         }          // --- BUILD TERRAIN ---         function rebuildTerrain() {             const caSteps = parseInt(document.getElementById('param-ca').value);             const density = parseFloat(document.getElementById('param-density').value);             const maxHeight = parseFloat(document.getElementById('param-height').value);             const waterLevel = parseFloat(document.getElementById('param-water').value);              waterMesh.position.y = waterLevel;              const heightmap = generateHeightmap(caSteps, density, maxHeight);             const posAttr = terrainGeo.attributes.position;             const colors = [];              for (let i = 0; i < posAttr.count; i++) {                 const ix = i % GRID_SIZE;                 const iz = Math.floor(i / GRID_SIZE);                 const h = heightmap[iz][ix];                  posAttr.setY(i, h);                  const c = getBiomeColor(h, maxHeight);                 colors.push(c.r, c.g, c.b);             }              terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));             posAttr.needsUpdate = true;             terrainGeo.computeVertexNormals();         }          // --- UI BINDINGS ---         document.querySelectorAll('input').forEach(input => {             input.addEventListener('input', (e) => {                 const labelId = 'val-' + e.target.id.split('-')[1];                 document.getElementById(labelId).innerText = e.target.value;             });         });          document.getElementById('btn-generate').addEventListener('click', rebuildTerrain);          window.addEventListener('resize', () => {             camera.aspect = window.innerWidth / window.innerHeight;             camera.updateProjectionMatrix();             renderer.setSize(window.innerWidth, window.innerHeight);         });          // Initialize         rebuildTerrain();          // --- ANIMATION LOOP ---         function animate(time) {             requestAnimationFrame(animate);             waterMesh.position.y = parseFloat(document.getElementById('param-water').value) + Math.sin(time * 0.002) * 0.2;             controls.update();             renderer.render(scene, camera);         }         animate(0);     </script> </body> </html>
