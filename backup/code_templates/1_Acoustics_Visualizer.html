<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Neon Vector Scope</title>    <style>        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }        canvas { display: block; }        #overlay {            position: absolute;            top: 50%;            left: 50%;            transform: translate(-50%, -50%);            text-align: center;            color: #00ff88;            z-index: 10;            cursor: pointer;            padding: 20px;            border: 2px solid #00ff88;            background: rgba(0, 0, 0, 0.8);            transition: all 0.3s;            text-transform: uppercase;            letter-spacing: 2px;        }        #overlay:hover { background: #00ff88; color: #000; }        #ui-hint {            position: absolute;            bottom: 20px;            width: 100%;            text-align: center;            color: rgba(0, 255, 136, 0.5);            font-size: 12px;            pointer-events: none;        }    </style></head><body>    <div id="overlay">Click to Initialize Audio</div>    <div id="ui-hint">Real-time 3D Vector Oscilloscope | Microphone Input Required</div>    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>    <script>const params = {            scene: null,             camera: null,             renderer: null,             audioContext: null,             analyser: null,             dataArray: null,             bufferLength: {{bufferlength}},             line: null,             points: [],             colors: [],             isInitialized: false,             geometry: null,             rotationSpeed: {{rotationspeed}},             pulseFactor: {{pulsefactor}},             light: null        };        function initThree() {            params.scene = new THREE.Scene();            params.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);            params.camera.position.z = 100;            params.renderer = new THREE.WebGLRenderer({ antialias: true });            params.renderer.setSize(window.innerWidth, window.innerHeight);            params.renderer.setPixelRatio(window.devicePixelRatio);            document.body.appendChild(params.renderer.domElement);            /* Visual Elements */            const geometry = new THREE.BufferGeometry();            const positions = new Float32Array(params.bufferLength * 3);            const colors = new Float32Array(params.bufferLength * 3);            for (let i = 0; i < params.bufferLength; i++) {                positions[i * 3] = (i - params.bufferLength / 2) * 0.2;                positions[i * 3 + 1] = 0;                positions[i * 3 + 2] = 0;                                colors[i * 3] = 0;                colors[i * 3 + 1] = 1;                colors[i * 3 + 2] = 0.5;            }            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));            const material = new THREE.LineBasicMaterial({                vertexColors: true,                 linewidth: 2,                 transparent: true,                 opacity: 0.8            });            params.line = new THREE.Line(geometry, material);            params.scene.add(params.line);            /* Add ambient light */            const ambientLight = new THREE.AmbientLight(0x00ff88,  0.2);            params.scene.add(ambientLight);            /* Add a point light that pulses */            params.light = new THREE.PointLight(0x00ff88, 1, 200);            params.scene.add(params.light);            window.addEventListener('resize', onWindowResize, false);        }        async function initAudio() {            try {                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });                params.audioContext = new (window.AudioContext || window.webkitAudioContext)();                const source = params.audioContext.createMediaStreamSource(stream);                params.analyser = params.audioContext.createAnalyser();                params.analyser.fftSize = 2048;                source.connect(params.analyser);                params.dataArray = new Uint8Array(params.analyser.frequencyBinCount);                params.isInitialized = true;                document.getElementById('overlay').style.display = 'none';                animate();            } catch (err) {                alert('Microphone access denied or not supported.');                console.error(err);            }        }        function onWindowResize() {            params.camera.aspect = window.innerWidth / window.innerHeight;            params.camera.updateProjectionMatrix();            params.renderer.setSize(window.innerWidth, window.innerHeight);        }        function animate() {            requestAnimationFrame(animate);            if (params.isInitialized) {                params.analyser.getByteTimeDomainData(params.dataArray);                const positions = params.line.geometry.attributes.position.array;                const colors = params.line.geometry.attributes.color.array;                let sum = {{sum}};                for (let i = 0; i < params.bufferLength; i++) {                    const v = params.dataArray[i] / 128.0 - 1.0;                    const y = v * 50;                                        /* Apply wave movement in 3D */                    positions[i * 3 + 1] = y;                    positions[i * 3 + 2] = Math.sin(Date.now() * 0.002 + i * 0.05) * 10;                    /* Dynamic Gradient Color (Green to Cyan) */                    colors[i * 3] = 0;                    colors[i * 3 + 1] = 0.5 + (v * 0.5);                    colors[i * 3 + 2] = 0.5 + Math.abs(v);                                        sum += Math.abs(v);                }                params.pulseFactor = sum / params.bufferLength;                params.line.geometry.attributes.position.needsUpdate = true;                params.line.geometry.attributes.color.needsUpdate = true;                /* Rotation and Pulse */                params.line.rotation.y += params.rotationSpeed;                params.line.rotation.z = Math.sin(Date.now() * 0.001) * 0.1;                                params.light.intensity = 1 + params.pulseFactor * 10;                params.camera.position.z = 100 + Math.sin(Date.now() * 0.0005) * 20;            }            params.renderer.render(params.scene, params.camera);        }        document.getElementById('overlay').addEventListener('click', () => {            if (!params.isInitialized) {                initThree();                initAudio();            }        });</script></body></html>
