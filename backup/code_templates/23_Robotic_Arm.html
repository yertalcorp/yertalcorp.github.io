<!DOCTYPE html><html lang='en'><head>    <meta charset='UTF-8'>    <meta name='viewport' content='width=device-width, initial-scale=1.0'>    <title>Neon IK Reach</title>    <style>        body { margin: 0; overflow: hidden; background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%); }        canvas { display: block; }        #ui { position: absolute; top: 20px; left: 20px; color: #4facfe; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; pointer-events: none; text-shadow: 0 0 10px rgba(79, 172, 254, 0.5); }    </style></head><body>    <div id='ui'>        <h1 style='margin:0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px;'>Neural Reach System</h1>        <p style='font-size: 0.8rem; opacity: 0.8;'>Inverse Kinematics Tracker Active</p>    </div>    <canvas id='armCanvas'></canvas>    <script>const params = {            segmentCount: {{segmentcount}},             segmentLength: {{segmentlength}},             baseX: window.innerWidth / 2,             baseY: window.innerHeight - 50,             jointRadius: {{jointradius}},             glowColor: "{{glowcolor}}",             accentColor: "{{accentcolor}}",             particleCount: {{particlecount}},             lerpSpeed: {{lerpspeed}},         };        const canvas = document.getElementById('armCanvas');        const ctx = canvas.getContext('2d');        let width,  height;        let mouse = { x: window.innerWidth / 2,  y: window.innerHeight / 2 };        let segments = [];        class Segment {            constructor(x, y, angle, len) {                this.a = { x, y };                this.len = len;                this.angle = angle;                this.calculateB();            }            calculateB() {                let dx = this.len * Math.cos(this.angle);                let dy = this.len * Math.sin(this.angle);                this.b = { x: this.a.x + dx, y: this.a.y + dy };            }            follow(targetX, targetY) {                let target = { x: targetX,  y: targetY };                let dirX = target.x - this.a.x;                let dirY = target.y - this.a.y;                this.angle = Math.atan2(dirY, dirX);                                this.a.x = target.x - Math.cos(this.angle) * this.len;                this.a.y = target.y - Math.sin(this.angle) * this.len;            }            update() {                this.calculateB();            }            draw(index) {                const thickness = 25 - (index * 4);                                /* Draw Segment Body (3D tubular gradient effect) */                ctx.beginPath();                ctx.lineWidth = thickness;                ctx.lineCap = 'round';                                let grad = ctx.createLinearGradient(this.a.x,  this.a.y,  this.b.x,  this.b.y);                grad.addColorStop(0, '#16213e');                grad.addColorStop(0.5, params.glowColor);                grad.addColorStop(1, '#16213e');                                ctx.strokeStyle = grad;                ctx.shadowBlur = 15;                ctx.shadowColor = params.glowColor;                ctx.moveTo(this.a.x, this.a.y);                ctx.lineTo(this.b.x, this.b.y);                ctx.stroke();                ctx.shadowBlur = 0;                /* Joint circle */                ctx.beginPath();                ctx.arc(this.a.x, this.a.y, params.jointRadius - (index * 1), 0, Math.PI * 2);                ctx.fillStyle = '#fff';                ctx.fill();                                /* Detail lines */                ctx.beginPath();                ctx.lineWidth = 2;                ctx.strokeStyle = 'rgba(255,255,255,0.3)';                ctx.moveTo(this.a.x, this.a.y);                ctx.lineTo(this.b.x, this.b.y);                ctx.stroke();            }        }        function init() {            resize();            segments = [];            for (let i = 0; i < params.segmentCount; i++) {                segments.push(new Segment(params.baseX, params.baseY, 0, params.segmentLength));            }        }        function resize() {            width = canvas.width = window.innerWidth;            height = canvas.height = window.innerHeight;            params.baseX = width / 2;            params.baseY = height - 50;        }        function drawGrid() {            ctx.strokeStyle = 'rgba(79, 172, 254, 0.05)';            ctx.lineWidth = 1;            const step = {{step}};            for(let i = 0; i < width; i += step) {                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();            }            for(let i = 0; i < height; i += step) {                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();            }        }        function animate() {            ctx.clearRect(0, 0, width, height);            drawGrid();            /* IK Logic */            let total = segments.length;            let last = segments[total - 1];                        /* Follow target */            last.follow(mouse.x, mouse.y);            last.update();            for (let i = total - 2; i >= 0; i--) {                segments[i].follow(segments[i + 1].a.x, segments[i + 1].a.y);                segments[i].update();            }            /* Fixed Base Constraint */            segments[0].a.x = params.baseX;            segments[0].a.y = params.baseY;            for (let i = 0; i < total; i++) {                if (i > 0) {                    segments[i].a.x = segments[i - 1].b.x;                    segments[i].a.y = segments[i - 1].b.y;                }                segments[i].update();                segments[i].draw(i);            }            /* Draw Claw / Tip */            const tip = segments[total-1].b;            ctx.beginPath();            ctx.arc(tip.x, tip.y, 12, 0, Math.PI * 2);            ctx.fillStyle = params.accentColor;            ctx.shadowBlur = 20;            ctx.shadowColor = params.accentColor;            ctx.fill();            ctx.shadowBlur = 0;            requestAnimationFrame(animate);        }        window.addEventListener('mousemove', (e) => {            mouse.x += (e.clientX - mouse.x) * params.lerpSpeed;            mouse.y += (e.clientY - mouse.y) * params.lerpSpeed;        });        window.addEventListener('resize', resize);        init();        animate();</script></body></html>
