<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Neon Logic 3D Simulator</title>     <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>     <style>         body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; color: white; user-select: none; }         #ui-layer {             position: absolute;             top: 20px;             left: 20px;             display: flex;             flex-direction: column;             gap: 10px;             z-index: 10;             background: rgba(255, 255, 255, 0.05);             padding: 20px;             border-radius: 15px;             backdrop-filter: blur(10px);             border: 1px solid rgba(255, 255, 255, 0.1);         }         .btn {             background: linear-gradient(45deg, {{gate_color_and}}, {{gate_color_or}});             border: none;             padding: 10px 20px;             color: white;             border-radius: 5px;             cursor: pointer;             font-weight: bold;             transition: transform 0.2s, box-shadow 0.2s;             text-transform: uppercase;             font-size: 12px;             letter-spacing: 1px;         }         .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(79, 172, 254, 0.6); }         .btn.delete { background: linear-gradient(45deg, {{gate_color_xor}}, {{gate_color_not}}); }         #instructions {             position: absolute;             bottom: 20px;             left: 50%;             transform: translateX(-50%);             background: rgba(0,0,0,0.5);             padding: 10px 20px;             border-radius: 20px;             font-size: 14px;             pointer-events: none;             z-index: 5;         }         canvas { display: block; position: absolute; top:0; left:0; width:100%; height:100%; }     </style> </head> <body>     <div id="config-carrier" data-engine-json='{{PARAMETER_MAP}}' style="display: none;"></div>      <div id="ui-layer">         <h2 style="margin: 0 0 10px 0; font-size: 18px;">LOGIC STUDIO</h2>         <button class="btn" onclick="addGate('AND')">Add AND Gate</button>         <button class="btn" onclick="addGate('OR')">Add OR Gate</button>         <button class="btn" onclick="addGate('XOR')">Add XOR Gate</button>         <button class="btn" onclick="addGate('NOT')">Add NOT Gate</button>         <button class="btn" onclick="addGate('INPUT')">Add Input Switch</button>         <button class="btn" onclick="addGate('BULB')">Add Light Bulb</button>         <button class="btn delete" onclick="clearBoard()">Clear All</button>     </div>     <div id="instructions">Left Click: Drag / Toggle Switch • Right Click Pins: Wire Components • Double Click: Delete</div>      <script>         (function() {             let scene, camera, renderer, raycaster, mouse;             let gates = [];             let connections = [];             let selectedGate = null;             let dragging = false;             let connectingPin = null;              let clickableMeshes = [];             let pinMeshes = [];              /* --- Configuration Parsing Isolation Core --- */             let CONFIG;             try {                 const carrier = document.getElementById('config-carrier');                 const rawJSON = carrier ? carrier.getAttribute('data-engine-json') : '';                 if (rawJSON && !rawJSON.startsWith('{{')) {                     CONFIG = JSON.parse(rawJSON);                 } else {                     throw new Error("Fallback required");                 }             } catch(e) {                 CONFIG = {                     gate_color_and: "{{gate_color_and}}",                     gate_color_or: "{{gate_color_or}}",                     gate_color_xor: "{{gate_color_xor}}",                     gate_color_not: "{{gate_color_not}}",                     gate_color_input: "{{gate_color_input}}",                     gate_color_bulb: "{{gate_color_bulb}}",                     wire_inactive_color: "{{wire_inactive_color}}",                     wire_active_color: "{{wire_active_color}}",                     gate_width: "{{gate_width}}",                     gate_height: "{{gate_height}}",                     gate_depth: "{{gate_depth}}",                     pin_radius: "{{pin_radius}}"                 };             }              const GATE_COLORS = {                 AND: parseInt(CONFIG.gate_color_and.replace("#", "0x")),                 OR: parseInt(CONFIG.gate_color_or.replace("#", "0x")),                 XOR: parseInt(CONFIG.gate_color_xor.replace("#", "0x")),                 NOT: parseInt(CONFIG.gate_color_not.replace("#", "0x")),                 INPUT: parseInt(CONFIG.gate_color_input.replace("#", "0x")),                 BULB: parseInt(CONFIG.gate_color_bulb.replace("#", "0x"))             };              const WIRE_INACTIVE = parseInt(CONFIG.wire_inactive_color.replace("#", "0x")) || 0x00f2fe;             const WIRE_ACTIVE = parseInt(CONFIG.wire_active_color.replace("#", "0x")) || 0xffff00;              const G_WIDTH = parseFloat(CONFIG.gate_width) || 2.2;             const G_HEIGHT = parseFloat(CONFIG.gate_height) || 0.4;             const G_DEPTH = parseFloat(CONFIG.gate_depth) || 1.4;             const PIN_RAD = parseFloat(CONFIG.pin_radius) || 0.16;              init();             animate();              function init() {                 scene = new THREE.Scene();                                  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);                 camera.position.set(0, 16, 12);                 camera.lookAt(0, 0, 0);                  renderer = new THREE.WebGLRenderer({ antialias: true });                 renderer.setSize(window.innerWidth, window.innerHeight);                 renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));                 document.body.appendChild(renderer.domElement);                  const grid = new THREE.GridHelper(40, 40, 0x444446, 0x222224);                 scene.add(grid);                  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);                 dirLight.position.set(5, 20, 5);                 scene.add(dirLight);                 scene.add(new THREE.AmbientLight(0x777777));                                  raycaster = new THREE.Raycaster();                 mouse = new THREE.Vector2();                  renderer.domElement.addEventListener('mousedown', onMouseDown);                 renderer.domElement.addEventListener('mousemove', onMouseMove);                 renderer.domElement.addEventListener('mouseup', onMouseUp);                 renderer.domElement.addEventListener('dblclick', onDoubleClick);                 renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());                                  window.addEventListener('resize', onWindowResize);             }              class Gate {                 constructor(type, x, z) {                     this.type = type;                     this.inputs = (type === 'NOT' || type === 'BULB') ? [0] : (type === 'INPUT' ? [] : [0, 0]);                     this.output = 0;                     this.connectedTo = [];                      this.pins = [];                      const geometry = new THREE.BoxGeometry(G_WIDTH, G_HEIGHT, G_DEPTH);                     const material = new THREE.MeshPhongMaterial({                          color: GATE_COLORS[type],                          transparent: true,                          opacity: 0.95,                         emissive: GATE_COLORS[type],                         emissiveIntensity: 0.15                     });                     this.mesh = new THREE.Mesh(geometry, material);                     this.mesh.position.set(x, G_HEIGHT / 2, z);                     scene.add(this.mesh);                      this.mesh.userData = { parentGate: this };                     clickableMeshes.push(this.mesh);                      this.createPins();                 }                  createPins() {                     if (this.type !== 'INPUT') {                         const count = (this.type === 'NOT' || this.type === 'BULB') ? 1 : 2;                         for (let i = 0; i < count; i++) {                             this.spawnPin(true, i, count);                         }                     }                     if (this.type !== 'BULB') {                         this.spawnPin(false, 0, 1);                     }                 }                  spawnPin(isInput, index, total) {                     const geo = new THREE.SphereGeometry(PIN_RAD, 16, 16);                     const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });                     const mesh = new THREE.Mesh(geo, mat);                                          const xOffset = isInput ? -(G_WIDTH / 2) : (G_WIDTH / 2);                     const zOffset = total > 1 ? (index === 0 ? -(G_DEPTH * 0.3) : (G_DEPTH * 0.3)) : 0;                                          mesh.position.set(xOffset, 0.1, zOffset);                     this.mesh.add(mesh);                       const pinData = { mesh: mesh, isInput: isInput, index: index, parentGate: this };                     this.pins.push(pinData);                     pinMeshes.push(mesh);                  }                  updateLogic() {                     switch(this.type) {                         case 'AND': this.output = (this.inputs[0] === 1 && this.inputs[1] === 1) ? 1 : 0; break;                         case 'OR':  this.output = (this.inputs[0] === 1 || this.inputs[1] === 1) ? 1 : 0; break;                         case 'XOR': this.output = (this.inputs[0] !== this.inputs[1]) ? 1 : 0; break;                         case 'NOT': this.output = this.inputs[0] === 0 ? 1 : 0; break;                         case 'INPUT': break;                          case 'BULB':                              this.output = this.inputs[0];                             this.mesh.material.emissiveIntensity = this.output ? 2.5 : 0.15;                             this.mesh.material.color.setHex(this.output ? 0xffff00 : GATE_COLORS.BULB);                             return;                     }                                          this.connectedTo.forEach(conn => {                         if (conn.gate) {                             conn.gate.inputs[conn.pinIndex] = this.output;                             conn.gate.updateLogic();                         }                     });                 }             }              window.addGate = function(type) {                 try {                     const gate = new Gate(type, (Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5);                     gates.push(gate);                     gate.updateLogic();                     updateWires();                 } catch(e) { console.error(e); }             };              function updateMouseCoords(event) {                 const rect = renderer.domElement.getBoundingClientRect();                 mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;                 mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;             }              function onMouseDown(event) {                 updateMouseCoords(event);                 raycaster.setFromCamera(mouse, camera);                  if (event.button === 2 && pinMeshes.length > 0) {                      const pinIntersects = raycaster.intersectObjects(pinMeshes);                     if (pinIntersects.length > 0) {                         const hitMesh = pinIntersects[0].object;                         let selectedPinData = null;                                                  for (let g of gates) {                             let match = g.pins.find(p => p.mesh === hitMesh);                             if (match) { selectedPinData = match; break; }                         }                         if (selectedPinData) handlePinClick(selectedPinData.parentGate, selectedPinData);                         return;                     }                 }                  if (event.button === 0 && clickableMeshes.length > 0) {                     const intersects = raycaster.intersectObjects(clickableMeshes);                     if (intersects.length > 0) {                         const targetMesh = intersects[0].object;                         const gateObj = targetMesh.userData.parentGate;                                                  if (gateObj) {                             selectedGate = gateObj;                             dragging = true;                                                          if (selectedGate.type === 'INPUT') {                                 selectedGate.output = selectedGate.output === 1 ? 0 : 1;                                 selectedGate.mesh.material.emissiveIntensity = selectedGate.output ? 2.0 : 0.15;                                 selectedGate.updateLogic();                                 updateWires();                             }                         }                     }                 }             }              function handlePinClick(gate, pin) {                 if (!connectingPin) {                     if (!pin.isInput) {                          connectingPin = pin;                         pin.mesh.material.color.setHex(0xffff00);                      }                 } else {                     if (pin.isInput && gate !== connectingPin.parentGate) {                         connectingPin.parentGate.connectedTo.push({ gate: gate, pinIndex: pin.index });                         createWire(connectingPin.parentGate, gate, pin.index);                         connectingPin.parentGate.updateLogic();                     }                     connectingPin.mesh.material.color.setHex(0xffffff);                     connectingPin = null;                 }             }              function createWire(fromGate, toGate, toPinIdx) {                 const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);                 const material = new THREE.LineBasicMaterial({ color: WIRE_INACTIVE, linewidth: 3 });                 const line = new THREE.Line(geometry, material);                 scene.add(line);                 connections.push({ line, from: fromGate, to: toGate, toPinIdx: toPinIdx });                 updateWires();             }              function onMouseMove(event) {                 updateMouseCoords(event);                 if (!dragging || !selectedGate) return;                  raycaster.setFromCamera(mouse, camera);                 const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);                 const target = new THREE.Vector3();                                  if (raycaster.ray.intersectPlane(plane, target)) {                     selectedGate.mesh.position.set(target.x, G_HEIGHT / 2, target.z);                     updateWires();                 }             }              function updateWires() {                 if (connections.length === 0) return;                                  connections.forEach(conn => {                     const fromPos = new THREE.Vector3();                     const toPos = new THREE.Vector3();                                          const outPin = conn.from.pins.find(p => !p.isInput);                     const inPin = conn.to.pins.find(p => p.isInput && p.index === conn.toPinIdx);                                          if (outPin && inPin) {                         outPin.mesh.getWorldPosition(fromPos);                         inPin.mesh.getWorldPosition(toPos);                         conn.line.material.color.setHex(conn.from.output ? WIRE_ACTIVE : WIRE_INACTIVE);                         conn.line.geometry.setFromPoints([fromPos, toPos]);                     }                 });             }              function onMouseUp() {                 dragging = false;                 selectedGate = null;             }              function onDoubleClick(event) {                 updateMouseCoords(event);                 if (clickableMeshes.length === 0) return;                  raycaster.setFromCamera(mouse, camera);                 const intersects = raycaster.intersectObjects(clickableMeshes);                 if (intersects.length > 0) {                     const targetMesh = intersects[0].object;                     const gate = targetMesh.userData.parentGate;                     if (!gate) return;                      scene.remove(gate.mesh);                                          clickableMeshes = clickableMeshes.filter(m => m !== gate.mesh);                     gate.pins.forEach(p => { pinMeshes = pinMeshes.filter(pm => pm !== p.mesh); });                     gates = gates.filter(g => g !== gate);                                          connections = connections.filter(c => {                         if (c.from === gate || c.to === gate) {                             scene.remove(c.line);                             return false;                         }                         return true;                     });                     updateWires();                 }             }              window.clearBoard = function() {                 gates.forEach(g => scene.remove(g.mesh));                 connections.forEach(c => scene.remove(c.line));                 gates = [];                 connections = [];                 clickableMeshes = [];                 pinMeshes = [];                 if (connectingPin) connectingPin = null;                 updateWires();             };              function onWindowResize() {                 camera.aspect = window.innerWidth / window.innerHeight;                 camera.updateProjectionMatrix();                 renderer.setSize(window.innerWidth, window.innerHeight);             }              function animate() {                 requestAnimationFrame(animate);                 if (renderer && scene && camera) renderer.render(scene, camera);             }         })();     </script> </body> </html>
