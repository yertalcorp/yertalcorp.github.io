<!DOCTYPE html> <html lang="en"> <head>   <meta charset="UTF-8" />   <title>Double Slit Experiment Simulation</title>   <style>     * { box-sizing: border-box; }     body {       margin: 0;       background: #0d0e12;       color: #fff;       font-family: system-ui, -apple-system, sans-serif;       overflow: hidden;       display: flex;       flex-direction: column;       align-items: center;       justify-content: center;       height: 100vh;     }     .ui {       position: absolute;       top: 20px;       left: 20px;       z-index: 10;       background: rgba(22, 27, 34, 0.85);       padding: 16px 20px;       border-radius: 10px;       border: 1px solid #30363d;       backdrop-filter: blur(8px);       box-shadow: 0 8px 24px rgba(0,0,0,0.5);     }     .lbl {       font-size: 11px;       letter-spacing: 1.5px;       color: #8b949e;       margin-bottom: 8px;       font-weight: 600;       text-transform: uppercase;     }     .btn {       background: #238636;       border: none;       color: #fff;       padding: 10px 18px;       border-radius: 6px;       cursor: pointer;       font-weight: 600;       font-size: 14px;       transition: background 0.2s, transform 0.1s;     }     .btn:hover { background: #2ea043; }     .btn:active { transform: scale(0.98); }     .btn.det-on {       background: #da3633;     }     .btn.det-on:hover { background: #f85149; }     canvas { display: block; }   </style> </head> <body>  <div class="ui">   <div class="lbl">Quantum Measurement Device</div>   <button id="ctrl" class="btn">DETECTOR: OFF (Wave Mode)</button> </div>  <canvas id="cvs"></canvas>  <script> const params = {   electrons: [],   interference: {{interference}},   pattern: [],   detector: {{detector}} };  const c = document.getElementById('cvs'); const ctx = c.getContext('2d'); const btn = document.getElementById('ctrl');  let w, h; let gunX, barrierX, screenX, screenW; let slit1Y, slit2Y, slitSize;  function resize() {   w = c.width = window.innerWidth;   h = c.height = window.innerHeight;    gunX = 80;   barrierX = w * 0.4;   screenX = w - 120;   screenW = 60;    slitSize = 12;   slit1Y = h / 2 - 45;   slit2Y = h / 2 + 45; }  function randomGaussian(mean, stdDev) {   let u = 0, v = 0;   while (u === 0) u = Math.random();   while (v === 0) v = Math.random();   return mean + stdDev * Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v); }  function getTargetY() {   if (params.detector) {     return Math.random() > 0.5        ? randomGaussian(slit1Y, 22)        : randomGaussian(slit2Y, 22);   } else {     let targetY, prob;     const screenCenter = h / 2;     const maxOffset = h * 0.42;      do {       targetY = screenCenter + (Math.random() * 2 - 1) * maxOffset;       const dy = (targetY - screenCenter) / 35;              const waveInterference = Math.pow(Math.cos(dy * 2.8), 2);       const envelope = Math.exp(-Math.pow(dy / 4.5, 2));              prob = waveInterference * envelope;     } while (Math.random() > prob);      return targetY;   } }  function spawnElectron() {   const targetY = getTargetY();   const chosenSlitY = targetY < h / 2 ? slit1Y : slit2Y;    params.electrons.push({     x: gunX,     y: h / 2,     targetY: targetY,     chosenSlitY: chosenSlitY,     speed: 7 + Math.random() * 2   }); }  function updateAndDraw() {   ctx.fillStyle = '#0d0e12';   ctx.fillRect(0, 0, w, h);    ctx.fillStyle = '#30363d';   ctx.fillRect(0, h / 2 - 25, gunX, 50);   ctx.fillStyle = '#58a6ff';   ctx.fillRect(gunX - 5, h / 2 - 5, 5, 10);    ctx.fillStyle = '#21262d';   ctx.fillRect(barrierX, 0, 16, slit1Y - slitSize / 2);   ctx.fillRect(barrierX, slit1Y + slitSize / 2, 16, (slit2Y - slitSize / 2) - (slit1Y + slitSize / 2));   ctx.fillRect(barrierX, slit2Y + slitSize / 2, 16, h - (slit2Y + slitSize / 2));    ctx.strokeStyle = '#30363d';   ctx.strokeRect(barrierX, 0, 16, h);    if (params.detector) {     ctx.lineWidth = 2;     ctx.strokeStyle = '#f85149';     ctx.beginPath();     ctx.arc(barrierX + 8, slit1Y, slitSize * 1.4, 0, Math.PI * 2);     ctx.arc(barrierX + 8, slit2Y, slitSize * 1.4, 0, Math.PI * 2);     ctx.stroke();      ctx.fillStyle = 'rgba(248, 81, 73, 0.15)';     ctx.fill();   }    ctx.fillStyle = '#f0f6fc';   ctx.fillRect(screenX, 20, screenW, h - 40);    ctx.fillStyle = '#30363d';   ctx.fillRect(screenX - 4, 10, screenW + 8, 10);   ctx.fillRect(screenX - 4, h - 20, screenW + 8, 10);    params.pattern.forEach(p => {     ctx.fillStyle = params.detector        ? `rgba(218, 54, 51, ${p.a})`       : `rgba(9, 105, 218, ${p.a})`;          ctx.beginPath();     ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);     ctx.fill();   });    for (let i = params.electrons.length - 1; i >= 0; i--) {     const e = params.electrons[i];     e.x += e.speed;      if (e.x < barrierX) {       const progress = (e.x - gunX) / (barrierX - gunX);       e.y = h / 2 + (e.chosenSlitY - h / 2) * progress;     } else {       const progress = (e.x - barrierX) / (screenX - barrierX);       e.y = e.chosenSlitY + (e.targetY - e.chosenSlitY) * Math.min(1, progress);     }      ctx.shadowBlur = 8;     ctx.shadowColor = params.detector ? '#f85149' : '#58a6ff';     ctx.fillStyle = params.detector ? '#ff7b72' : '#79c0ff';     ctx.beginPath();     ctx.arc(e.x, e.y, 3.5, 0, Math.PI * 2);     ctx.fill();     ctx.shadowBlur = 0;      if (e.x >= screenX) {       params.pattern.push({         x: screenX + Math.random() * (screenW - 4) + 2,         y: e.y,         r: 2 + Math.random() * 1.5,         a: 0.7 + Math.random() * 0.3       });        params.electrons.splice(i, 1);     }   }    if (params.pattern.length > 2500) {     params.pattern.splice(0, params.pattern.length - 2500);   }    requestAnimationFrame(updateAndDraw); }  btn.onclick = () => {   params.detector = !params.detector;   params.pattern = [];      if (params.detector) {     btn.textContent = 'DETECTOR: ON (Particle Mode)';     btn.classList.add('det-on');   } else {     btn.textContent = 'DETECTOR: OFF (Wave Mode)';     btn.classList.remove('det-on');   } };  window.onresize = resize;  resize(); setInterval(spawnElectron, 35); updateAndDraw(); </script>  </body> </html>
