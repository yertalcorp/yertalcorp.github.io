<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Somnus - Sleep Architecture Planner</title>    <style>        /* Global Structural Component Styles */        * { box-sizing: border-box; margin: 0; padding: 0; }        body, html {             width: 100%; height: 100%; overflow-x: hidden;             background: linear-gradient(135deg, {{SLEEP_PLANNER_BG_GRADIENT_START}}, {{SLEEP_PLANNER_BG_GRADIENT_END}});             color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;        }        .app-container { max-width: 1100px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }        .app-header { text-align: center; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }        .app-title { font-size: 28px; font-weight: 700; tracking: 0.05em; background: linear-gradient(90deg, {{SLEEP_PLANNER_ACCENT_CYAN}}, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 24px; }        @media (min-width: 768px) { .grid-layout { grid-template-columns: 350px 1fr; } }                /* Reusable Glassmorphism Cards */        .card {             background: rgba(15, 10, 30, 0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);            border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px;        }        .card-title { font-size: 16px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }                /* Form Elements */        .toggle-group { display: grid; grid-template-columns: 1fr 1fr; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }        .btn-toggle { background: transparent; border: none; color: #94a3b8; padding: 8px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; transition: all 0.2s; }        .btn-toggle.active { background: rgba(0, 240, 255, 0.15); color: {{SLEEP_PLANNER_ACCENT_CYAN}}; border: 1px solid rgba(0, 240, 255, 0.2); font-weight: 600; }        .input-time { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; font-size: 22px; font-weight: 700; color: {{SLEEP_PLANNER_ACCENT_CYAN}}; text-align: center; color-scheme: dark; }        .slider-group { display: flex; flex-direction: column; gap: 6px; }        .slider-label { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; }        .slider-input { width: 100%; accent-color: {{SLEEP_PLANNER_ACCENT_CYAN}}; cursor: pointer; background: rgba(255,255,255,0.1); height: 4px; border-radius: 2px; outline: none; }                /* Graphics Views */        .canvas-container { position: relative; width: 100%; height: 200px; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }        canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }                /* Timeline Output Tracks */        .timeline-list { display: flex; flex-direction: column; gap: 12px; }        .timeline-row {             display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;             background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.04); transition: border 0.2s;        }        .timeline-row:hover { border-color: rgba(0, 240, 255, 0.25); }        .cycle-tag { font-size: 10px; font-weight: 700; tracking: 0.1em; color: #64748b; text-transform: uppercase; }        .cycle-time { font-size: 18px; font-weight: 700; color: #fff; margin-top: 2px; }        .progress-bar-wrapper { flex: 1; margin: 0 20px; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, {{SLEEP_PLANNER_ACCENT_CYAN}}, {{SLEEP_PLANNER_ACCENT_PURPLE}}); transition: width 0.3s; }        .meta-right { text-align: right; }        .status-badge { font-size: 12px; font-weight: 600; color: {{SLEEP_PLANNER_ACCENT_PURPLE}}; }        .duration-label { font-size: 11px; color: #64748b; display: block; margin-top: 2px; }    </style></head><body>    <div class="app-container">        <header class="app-header">            <div class="app-title">SOMNUS</div>            <div style="font-size: 11px; color: {{SLEEP_PLANNER_ACCENT_CYAN}}; letter-spacing: 0.2em; margin-top: 2px; font-weight: 600;">REM ARCHITECTURE LAB</div>        </header>        <div class="grid-layout">            <!-- Control Column -->            <div class="card">                <div class="card-title">Configuration Engine</div>                <div class="toggle-group">                    <button id="mode-sleep" class="btn-toggle active">Go to Bed at</button>                    <button id="mode-wake" class="btn-toggle">Wake up at</button>                </div>                <div>                    <input type="time" id="target-time" value="{{SLEEP_PLANNER_DEFAULT_BEDTIME}}" class="input-time">                </div>                <div class="slider-group">                    <div class="slider-label">                        <span>Cycle Duration</span>                        <span style="color:{{SLEEP_PLANNER_ACCENT_CYAN}};" id="lbl-cycle">{{SLEEP_PLANNER_CYCLE_MINUTES}} min</span>                    </div>                    <input type="range" id="input-cycle" min="80" max="110" value="{{SLEEP_PLANNER_CYCLE_MINUTES}}" class="slider-input">                </div>                <div class="slider-group">                    <div class="slider-label">                        <span>Sleep Latency</span>                        <span style="color:{{SLEEP_PLANNER_ACCENT_PURPLE}};" id="lbl-latency">{{SLEEP_PLANNER_BASE_LATENCY}} min</span>                    </div>                    <input type="range" id="input-latency" min="0" max="45" step="5" value="{{SLEEP_PLANNER_BASE_LATENCY}}" class="slider-input">                </div>            </div>            <!-- Outputs Column -->            <div style="display: flex; flex-direction: column; gap: 24px;">                <div class="card">                    <div class="card-title">Pristine REM Hypnogram Curve Map</div>                    <div class="canvas-container" id="canvas-wrap">                        <canvas id="curve-canvas"></canvas>                    </div>                </div>                <div class="card">                    <div class="card-title">Optimal Waking Target Schedules</div>                    <div class="timeline-list" id="timeline-container"></div>                </div>            </div>        </div>    </div>    <script type="module">        const state = {            mode: 'sleep',            baseMinutes: {{SLEEP_PLANNER_CYCLE_MINUTES}},            latency: {{SLEEP_PLANNER_BASE_LATENCY}},            canvas: document.getElementById('curve-canvas'),            ctx: null        };        state.ctx = state.canvas.getContext('2d');        function initCanvas() {            const rect = document.getElementById('canvas-wrap').getBoundingClientRect();            state.canvas.width = rect.width;            state.canvas.height = rect.height;            renderCurve();        }        function setMode(mode) {            state.mode = mode;            document.getElementById('mode-sleep').classList.toggle('active', mode === 'sleep');            document.getElementById('mode-wake').classList.toggle('active', mode === 'wake');            processArchitecture();        }        function updateSliders() {            state.baseMinutes = parseInt(document.getElementById('input-cycle').value);            state.latency = parseInt(document.getElementById('input-latency').value);            document.getElementById('lbl-cycle').textContent = state.baseMinutes + ' min';            document.getElementById('lbl-latency').textContent = state.latency + ' min';            processArchitecture();        }        function formatTime(date) {            let hrs = date.getHours();            let mins = date.getMinutes();            const ampm = hrs >= 12 ? 'PM' : 'AM';            hrs = hrs % 12 || 12;            mins = mins < 10 ? '0' + mins : mins;            return `${hrs}:${mins} ${ampm}`;        }        function renderCurve() {            const ctx = state.ctx;            const w = state.canvas.width;            const h = state.canvas.height;            if (!w || !h) return;            ctx.clearRect(0, 0, w, h);            ctx.strokeStyle = 'rgba(255,255,255,0.05)';            ctx.lineWidth = 1;            ctx.beginPath();            ctx.moveTo(0, h - 30); ctx.lineTo(w, h - 30);            ctx.stroke();            ctx.strokeStyle = '{{SLEEP_PLANNER_ACCENT_CYAN}}';            ctx.lineWidth = 2.5;            ctx.beginPath();            ctx.moveTo(0, h - 40);            for (let x = 0; x < w; x++) {                let progress = x / w;                let baseWave = Math.sin(progress * Math.PI * 11);                let depthMod = Math.sin(progress * Math.PI * 1.2);                let y = (h / 2) + (baseWave * 45 * depthMod) - 10;                ctx.lineTo(x, y);            }            ctx.stroke();        }        function processArchitecture() {            const timeVal = document.getElementById('target-time').value;            if (!timeVal) return;            const [hrs, mins] = timeVal.split(':').map(Number);            let anchor = new Date(); anchor.setHours(hrs, mins, 0, 0);            let targetList = [];            let container = document.getElementById('timeline-container');            container.innerHTML = '';            for (let i = 3; i <= 6; i++) {                let totalDelta = state.latency + (i * state.baseMinutes);                let calculatedTime = new Date(anchor.getTime() + (state.mode === 'sleep' ? totalDelta : -totalDelta) * 60000);                targetList.push({                    cycle: i,                    timeStr: formatTime(calculatedTime),                    duration: ((i * state.baseMinutes) / 60).toFixed(1),                    pct: (i / 6) * 100                });            }            if (state.mode === 'wake') targetList.reverse();            container.innerHTML = targetList.map(item => `                <div class="timeline-row">                    <div>                        <span class="cycle-tag">Cycle ${item.cycle}</span>                        <div class="cycle-time">${item.timeStr}</div>                    </div>                    <div class="progress-bar-wrapper">                        <div class="progress-bar-fill" style="width: ${item.pct}%"></div>                    </div>                    <div class="meta-right">                        <span class="status-badge" style="color: ${item.cycle >= 5 ? '{{SLEEP_PLANNER_ACCENT_CYAN}}' : '{{SLEEP_PLANNER_ACCENT_PURPLE}}'}">${item.cycle >= 5 ? 'Excellent' : 'Optimal'}</span>                        <span class="duration-label">${item.duration} hrs sleep</span>                    </div>                </div>            `).join('');            renderCurve();        }        /* Secure Programmatic Event Listeners Mapping */        document.getElementById('mode-sleep').addEventListener('click', () => setMode('sleep'));        document.getElementById('mode-wake').addEventListener('click', () => setMode('wake'));        document.getElementById('target-time').addEventListener('change', processArchitecture);        document.getElementById('input-cycle').addEventListener('input', updateSliders);        document.getElementById('input-latency').addEventListener('input', updateSliders);        // Clean layout handling without thrashing the wrapper's observer metrics        let resizeTimeout;        window.addEventListener('resize', () => {            clearTimeout(resizeTimeout);            resizeTimeout = setTimeout(initCanvas, 100);        });        initCanvas();        processArchitecture();    </script></body></html>
