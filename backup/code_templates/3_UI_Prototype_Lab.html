<!DOCTYPE html><html lang='en'><head>    <meta charset='UTF-8'>    <meta name='viewport' content='width=device-width, initial-scale=1.0'>    <title>Glass Layout Architect</title>    <style>        :root {            --primary-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);            --glass-bg: rgba(255, 255, 255, 0.1);            --glass-border: rgba(255, 255, 255, 0.2);            --accent: #00f2fe;        }        * {            box-sizing: border-box;            margin: 0;            padding: 0;            font-family: 'Segoe UI', Roboto, sans-serif;        }        body {            min-height: 100vh;            background: #0f0c29;            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);            display: flex;            overflow: hidden;            color: white;        }        /* 3D Background Elements */        .orb {            position: absolute;            width: 300px;            height: 300px;            border-radius: 50%;            background: var(--primary-grad);            filter: blur(80px);            z-index: 0;            animation: float 20s infinite alternate ease-in-out;        }        @keyframes float {            from { transform: translate(-10%, -10%) rotate(0deg); }            to { transform: translate(20%, 20%) rotate(360deg); }        }        /* Layout */        #app-container {            display: flex;            width: 100vw;            height: 100vh;            padding: 20px;            gap: 20px;            position: relative;            z-index: 1;        }        /* Sidebar */        aside {            width: 300px;            background: var(--glass-bg);            backdrop-filter: blur(15px);            border: 1px solid var(--glass-border);            border-radius: 20px;            padding: 25px;            display: flex;            flex-direction: column;            gap: 20px;        }        .control-group {            display: flex;            flex-direction: column;            gap: 10px;        }        label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }        button {            background: rgba(255, 255, 255, 0.1);            border: 1px solid var(--glass-border);            color: white;            padding: 12px;            border-radius: 10px;            cursor: pointer;            transition: 0.3s;            font-weight: 600;        }        button:hover {            background: var(--accent);            color: #000;            transform: translateY(-2px);            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);        }        /* Workspace */        main {            flex: 1;            background: var(--glass-bg);            backdrop-filter: blur(10px);            border: 1px solid var(--glass-border);            border-radius: 20px;            padding: 30px;            overflow-y: auto;            display: flex;            flex-wrap: wrap;            align-content: flex-start;            gap: 20px;            transition: all 0.5s ease;        }        /* Dynamic Components */        .glass-card {            background: rgba(255, 255, 255, 0.05);            border: 1px solid var(--glass-border);            padding: 20px;            border-radius: 15px;            min-width: 200px;            flex: 0 1 auto;            animation: fadeIn 0.4s ease-out forwards;            position: relative;            overflow: hidden;        }        .glass-card::before {            content: '';            position: absolute;            top: 0; left: -100%;            width: 100%; height: 100%;            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);            transition: 0.5s;        }        .glass-card:hover::before {            left: 100%;        }        @keyframes fadeIn {            from { opacity: 0; transform: scale(0.9) translateY(20px); }            to { opacity: 1; transform: scale(1) translateY(0); }        }        .card-title { font-size: 1.2rem; margin-bottom: 10px; display: block; }        .card-val { font-size: 2rem; font-weight: bold; color: var(--accent); }        .graph-bar {            height: 10px;            background: rgba(255,255,255,0.1);            border-radius: 5px;            margin-top: 15px;            overflow: hidden;        }        .graph-fill {            height: 100%;            background: var(--accent);            width: 0;            transition: width 1s ease-in-out;        }        /* 3D Object Component */        .scene3d {            width: 100px; height: 100px;            perspective: 600px;            margin: 0 auto;        }        .cube {            width: 100%; height: 100%;            position: relative;            transform-style: preserve-3d;            animation: rotateCube 5s infinite linear;        }        .cube-face {            position: absolute;            width: 100%; height: 100%;            background: rgba(0, 242, 254, 0.3);            border: 2px solid var(--accent);        }        .front  { transform: translateZ(50px); }        .back   { transform: rotateY(180deg) translateZ(50px); }        .right  { transform: rotateY(90deg) translateZ(50px); }        .left   { transform: rotateY(-90deg) translateZ(50px); }        .top    { transform: rotateX(90deg) translateZ(50px); }        .bottom { transform: rotateX(-90deg) translateZ(50px); }        @keyframes rotateCube {            from { transform: rotateX(0deg) rotateY(0deg); }            to { transform: rotateX(360deg) rotateY(360deg); }        }        /* Custom scrollbar */        ::-webkit-scrollbar {            width: 8px;        }        ::-webkit-scrollbar-track {            background: transparent;        }        ::-webkit-scrollbar-thumb {            background: var(--glass-border);            border-radius: 10px;        }    </style></head><body>    <div class='orb' style='top: -100px; left: -100px;'></div>    <div class='orb' style='bottom: -100px; right: -100px; background: #f093fb;'></div>    <div id='app-container'>        <aside>            <h2 style='margin-bottom: 20px;'>Architect UI</h2>                        <div class='control-group'>                <label>Flex Direction</label>                <button onclick="params.setLayout('row')">Row</button>                <button onclick="params.setLayout('column')">Column</button>            </div>            <div class='control-group'>                <label>Alignment</label>                <button onclick="params.setAlign('center')">Center</button>                <button onclick="params.setAlign('flex-start')">Start</button>                <button onclick="params.setAlign('space-between')">Space Between</button>            </div>            <div class='control-group' style='margin-top: auto;'>                <label>Inject Components</label>                <button onclick="params.addComponent('stat')">+ Metric Card</button>                <button onclick="params.addComponent('chart')">+ Progress Card</button>                <button onclick="params.addComponent('cube')">+ 3D Object</button>                <button onclick="params.clear()" style='background: rgba(255, 50, 50, 0.2);'>Clear All</button>            </div>        </aside>        <main id='canvas'></main>    </div>    <script>const params = {            canvas: document.getElementById('canvas'),             itemCount: {{itemcount}},                         setLayout: function(dir) {                this.canvas.style.flexDirection = dir;            },                        setAlign: function(align) {                this.canvas.style.justifyContent = align;            },            addComponent: function(type) {                this.itemCount++;                const card = document.createElement('div');                card.className = 'glass-card';                                if (type === 'stat') {                    card.innerHTML = `                        <span class='card-title'>Active Users</span>                        <div class='card-val'>${(Math.random() * 10).toFixed(1)}k</div>                        <p style='font-size:0.7rem; opacity:0.6;'>+12% from last week</p>                    `;                } else if (type === 'chart') {                    const val = Math.floor(Math.random() * 80) + 20;                    card.innerHTML = `                        <span class='card-title'>Server Load</span>                        <div class='card-val'>${val}%</div>                        <div class='graph-bar'><div class='graph-fill' id='bar-${this.itemCount}'></div></div>                    `;                    setTimeout(() => {                        document.getElementById(`bar-${this.itemCount}`).style.width = val + '%';                    }, 100);                } else if (type === 'cube') {                    card.innerHTML = `                        <span class='card-title' style='text-align:center'>Core Entity</span>                        <div class='scene3d'>                            <div class='cube'>                                <div class='cube-face front'></div>                                <div class='cube-face back'></div>                                <div class='cube-face right'></div>                                <div class='cube-face left'></div>                                <div class='cube-face top'></div>                                <div class='cube-face bottom'></div>                            </div>                        </div>                    `;                }                                this.canvas.appendChild(card);            },            clear: function() {                this.canvas.innerHTML = '';                this.itemCount = 0;            }        };        /* Init with some components */        params.addComponent('stat');        params.addComponent('chart');        params.addComponent('cube');</script></body></html>
