<!DOCTYPE html>  <html lang="en">  <head>         <meta charset="UTF-8">         <meta name="viewport" content="width=device-width, initial-scale=1.0">         <title>2.5D Spatial Architect</title>         <style>             :root {                 --bg: #0f172a;                 --panel: rgba(30, 41, 59, 0.7);                 --accent: #38bdf8;                 --wall: #f8fafc;                 --floor: rgba(56, 189, 248, 0.1);                 --text: #f1f5f9;             }             body, html {                 margin: 0;                 padding: 0;                 width: 100%;                 height: 100%;                 overflow: hidden;                 background-color: var(--bg);                 font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;                 color: var(--text);             }             canvas {                 display: block;                 cursor: crosshair;             }             #ui-layer {                 position: absolute;                 bottom: 12px;                 left: 50%;                 transform: translateX(-50%);                 z-index: 10;                 pointer-events: none;                 width: 94%;                 max-width: 940px;             }             .glass-panel {                 background: var(--panel);                 backdrop-filter: blur(12px);                 border: 1px solid rgba(255, 255, 255, 0.1);                 border-radius: 12px;                 padding: 8px 16px;                 pointer-events: auto;                 box-shadow: 0 10px 25px rgba(0,0,0,0.3);                 display: grid;                 grid-template-columns: 1.2fr 1fr;                 gap: 16px;                 align-items: center;             }             .controls-col {                 display: grid;                 grid-template-columns: repeat(3, 1fr);                 gap: 8px;                 width: 100%;             }             button {                 background: rgba(255, 255, 255, 0.05);                 border: 1px solid rgba(255, 255, 255, 0.2);                 color: white;                 padding: 6px 12px;                 border-radius: 6px;                 cursor: pointer;                 transition: all 0.3s;                 font-size: 0.78rem;                 white-space: nowrap;                 text-align: center;                 width: 100%;                 box-sizing: border-box;             }             button:hover, button.active {                 background: var(--accent);                 border-color: var(--accent);                 color: var(--bg);             }             .hint-panel {                 background: rgba(15, 23, 42, 0.4);                 border: 1px solid rgba(255, 255, 255, 0.05);                 border-radius: 8px;                 padding: 8px 12px;                 height: 100%;                 box-sizing: border-box;                 display: flex;                 flex-direction: column;                 justify-content: center;             }             .hint {                 margin-top: 0;                 font-size: 0.7rem;                 opacity: 0.6;                 line-height: 1.3;                 text-align: left;                 padding-top: 0;                 border-top: none;             }             .stats {                 position: absolute;                 top: 20px;                 right: 20px;                 font-family: monospace;                 font-size: 0.8rem;                 color: var(--accent);             }         </style>  </head>  <body>         <div id="config-carrier" data-engine-json='{{ENGINE_CONFIG_JSON}}' style="display: none;"></div>          <div id="ui-layer">             <div class="glass-panel">                 <div class="controls-col">                     <button onclick="setMode('WALL')" id="btn-WALL" class="active">Wall Mode</button>                     <button onclick="setMode('DOOR')" id="btn-DOOR">Door Mode</button>                     <button onclick="setMode('WINDOW')" id="btn-WINDOW">Window Mode</button>                     <button onclick="undoLastAction()">Undo Action</button>                     <button onclick="clearCanvas()">Clear Plan</button>                     <button onclick="toggleView()" id="viewBtn">View: 2.5D Perspective</button>                 </div>                                  <div class="hint-panel">                     <div class="hint">                         • <b>Wall & Door Mode</b>: Click to establish standalone discrete start/end segments.<br>                         • <b>Window Mode</b>: Click over an existing wall segment to carve a sub-window frame.                     </div>                 </div>             </div>          </div>         <div class="stats" id="stats">Elements: 0</div>         <canvas id="mainCanvas"></canvas>       <script type="text/javascript">         let CONFIG;         try {             const carrier = document.getElementById('config-carrier');             const rawJSON = carrier ? carrier.getAttribute('data-engine-json') : '';                                                  if (rawJSON && !rawJSON.startsWith('{{')) {                 CONFIG = JSON.parse(rawJSON);             } else {                 throw new Error("Template fallback required");             }         } catch(e) {             CONFIG = {                 initialMode: "WALL",                 dimensions: { gridSize: 30, wallHeight: 80, wallThickness: 4 },                 colors: { gridColor: "#1e293b", wallStroke: "#334155", windowColor: "#38bdf8", doorColor: "#b45309", accent: "#38bdf8" }             };         }         const canvas = document.getElementById('mainCanvas');         const ctx = canvas.getContext('2d');         const stats = document.getElementById('stats');         let width, height;         let segments = [];         let historyStack = [];         let activePath = [];         let mouse = { x: 0, y: 0, worldX: 0, worldY: 0 };         let offset = { x: 0, y: 0 };         let is3D = true;         let mode = CONFIG.initialMode || "WALL";         const GRID_SIZE = CONFIG.dimensions.gridSize;         const WALL_HEIGHT = CONFIG.dimensions.wallHeight;         const WALL_THICKNESS = CONFIG.dimensions.wallThickness;         const GRID_COLOR = (CONFIG.colors && CONFIG.colors.gridColor) ? CONFIG.colors.gridColor : "#1e293b";                 function init() {             resize();             window.addEventListener('resize', resize);             canvas.addEventListener('mousedown', onMouseDown);             canvas.addEventListener('mousemove', onMouseMove);             animate();         }                 function resize() {             width = window.innerWidth;             height = window.innerHeight;             canvas.width = width;             canvas.height = height;             offset.x = width / 2;             offset.y = is3D ? height / 2.3 : height / 2; }                 function saveHistoryState() {             historyStack.push(JSON.stringify(segments));         }                 function undoLastAction() {             if (historyStack.length > 0) {                 const previousState = historyStack.pop();                 segments = JSON.parse(previousState);                 activePath = [];                 updateStats();             }         }                 function setMode(newMode) {             mode = newMode;             document.querySelectorAll('.controls-col button').forEach(b => {                 if(b.id.startsWith('btn-')) b.classList.remove('active');             });             const activeBtn = document.getElementById(`btn-${newMode}`);             if(activeBtn) activeBtn.classList.add('active');                                                                                      activePath = [];             updateStats();         }                 function project(x, y, z = 0) {             if (!is3D) return { x: x + offset.x, y: y + offset.y };             const isoX = (x - y) * Math.cos(Math.PI / 6);             const isoY = (x + y) * Math.sin(Math.PI / 6) - z;             return { x: isoX + offset.x, y: isoY + offset.y };         }                 function unproject(screenX, screenY) {             const tx = screenX - offset.x;             const ty = screenY - offset.y;             if (!is3D) return { x: tx, y: ty };                                              const cos30 = Math.cos(Math.PI / 6);             const sin30 = Math.sin(Math.PI / 6);                                              const x = (tx / (2 * cos30) + ty / (2 * sin30));             const y = (ty / (2 * sin30) - tx / (2 * cos30));             return { x, y };         }                 function onMouseMove(e) {             const rect = canvas.getBoundingClientRect();             mouse.x = e.clientX - rect.left;             mouse.y = e.clientY - rect.top;                                                                                      const worldPos = unproject(mouse.x, mouse.y);             mouse.worldX = Math.round(worldPos.x / GRID_SIZE) * GRID_SIZE;             mouse.worldY = Math.round(worldPos.y / GRID_SIZE) * GRID_SIZE;         }                 function pDistance(x, y, x1, y1, x2, y2) {             const A = x - x1;             const B = y - y1;             const C = x2 - x1;             const D = y2 - y1;             const dot = A * C + B * D;             const lenSq = C * C + D * D;             let param = -1;             if (lenSq !== 0) param = dot / lenSq;             let xx, yy;             if (param < 0) {                 xx = x1;                 yy = y1;             } else if (param > 1) {                 xx = x2;                 yy = y2;             } else {                 xx = x1 + param * C;                 yy = y1 + param * D;             }             const dx = x - xx;             const dy = y - yy;             return Math.hypot(dx, dy);         }                 function findClosestSegment(wx, wy) {             let closestIndex = -1;             let minDist = 15;                                                                                          segments.forEach((seg, index) => {                 const d = pDistance(wx, wy, seg.p1.x, seg.p1.y, seg.p2.x, seg.p2.y);                 if (d < minDist) {                     minDist = d;                     closestIndex = index;                 }             });             return closestIndex;         }                 function onMouseDown(e) {             const currentPoint = { x: mouse.worldX, y: mouse.worldY };             if (mode === 'WINDOW') {                 const targetSegIdx = findClosestSegment(mouse.worldX, mouse.worldY);                 if (targetSegIdx !== -1 && segments[targetSegIdx].type === 'WALL') {                     saveHistoryState();                     const orig = segments[targetSegIdx];                                                                        segments.splice(targetSegIdx, 1);                     const dx = orig.p2.x - orig.p1.x;                     const dy = orig.p2.y - orig.p1.y;                     const len = Math.hypot(dx, dy);                                                                        const winWidth = Math.min(GRID_SIZE * 2, len * 0.6);                                                                        const mx = currentPoint.x;                     const my = currentPoint.y;                     const ux = dx / len;                     const uy = dy / len;                     const wp1 = { x: mx - ux * (winWidth / 2), y: my - uy * (winWidth / 2) };                     const wp2 = { x: mx + ux * (winWidth / 2), y: my + uy * (winWidth / 2) };                     if (Math.hypot(wp1.x - orig.p1.x, wp1.y - orig.p1.y) > 2) {                         segments.push({ p1: orig.p1, p2: wp1, type: 'WALL' });                     }                     segments.push({ p1: wp1, p2: wp2, type: 'WINDOW' });                     if (Math.hypot(orig.p2.x - wp2.x, orig.p2.y - wp2.y) > 2) {                         segments.push({ p1: wp2, p2: orig.p2, type: 'WALL' });                     }                                                                        updateStats();                 }                 return;             }             if (mode === 'WALL' || mode === 'DOOR') {                 if (activePath.length > 0) {                     if (activePath[0].x !== currentPoint.x || activePath[0].y !== currentPoint.y) {                         saveHistoryState();                         segments.push({                             p1: { ...activePath[0] },                             p2: { ...currentPoint },                             type: mode                         });                     }                     activePath = [];                 } else {                     activePath.push(currentPoint);                 }                 updateStats();             }         }                 function updateStats() {             stats.innerText = `Elements: ${segments.length} | Mode: ${mode}`;         }                 function clearCanvas() {             saveHistoryState();             segments = [];             activePath = [];             updateStats();         }                 function toggleView() {             is3D = !is3D;             document.getElementById('viewBtn').innerText = is3D ? "View: 2.5D Perspective" : "View: Top Down";             offset.y = is3D ? height / 2.3 : height / 2; }                 function drawGrid() {             ctx.strokeStyle = GRID_COLOR || "#1e293b"; ctx.lineWidth = 1;             const range = 20;             for (let i = -range; i <= range; i++) {                 ctx.beginPath();                 const p1 = project(-range * GRID_SIZE, i * GRID_SIZE);                 const p2 = project(range * GRID_SIZE, i * GRID_SIZE);                 ctx.moveTo(p1.x, p1.y);                 ctx.lineTo(p2.x, p2.y);                 ctx.stroke();                 ctx.beginPath();                 const p3 = project(i * GRID_SIZE, -range * GRID_SIZE);                 const p4 = project(i * GRID_SIZE, range * GRID_SIZE);                 ctx.moveTo(p3.x, p3.y);                 ctx.lineTo(p4.x, p4.y);                 ctx.stroke();             }         }                 function drawRenderedSegment(p1, p2, type = 'WALL', isPreview = false) {             const base1 = project(p1.x, p1.y, 0);             const base2 = project(p2.x, p2.y, 0);                                                                                      let zHeight = WALL_HEIGHT;             let zBase = 0;                                                                                      if (type === 'WINDOW') {                 zBase = WALL_HEIGHT * 0.35;                 zHeight = WALL_HEIGHT * 0.75;             } else if (type === 'DOOR') {                 zHeight = WALL_HEIGHT * 0.80;             }             const actualHeight = is3D ? zHeight : 0;             const actualBase = is3D ? zBase : 0;             const top1 = is3D ? { x: base1.x, y: base1.y - WALL_HEIGHT } : { ...base1 };             const top2 = is3D ? { x: base2.x, y: base2.y - WALL_HEIGHT } : { ...base2 };             const wTop1 = is3D ? { x: base1.x, y: base1.y - actualHeight } : { ...base1 };             const wTop2 = is3D ? { x: base2.x, y: base2.y - actualHeight } : { ...base2 };             const bStart = is3D ? { x: base1.x, y: base1.y - actualBase } : { ...base1 };             const bEnd = is3D ? { x: base2.x, y: base2.y - actualBase } : { ...base2 };             const opacity = isPreview ? 0.4 : 1.0;             if (is3D && !isPreview && (type === 'WALL' || type === 'WINDOW')) {                 ctx.fillStyle = `rgba(56, 189, 248, 0.05)`;                 ctx.beginPath();                 ctx.moveTo(base1.x, base1.y);                 ctx.lineTo(base2.x, base2.y);                 ctx.lineTo(top2.x, top2.y);                 ctx.lineTo(top1.x, top1.y);                 ctx.fill();             }             if (type === 'WINDOW' && is3D) {                 ctx.fillStyle = (CONFIG.colors && CONFIG.colors.wallStroke) || '#334155';                 const wallGrad = ctx.createLinearGradient(base1.x, base1.y, top1.x, top1.y);                 wallGrad.addColorStop(0, `rgba(30, 41, 59, ${opacity})`);                 wallGrad.addColorStop(1, `rgba(51, 65, 85, ${opacity})`);                 ctx.fillStyle = wallGrad;                 ctx.strokeStyle = isPreview ? `rgba(56, 189, 248, 0.4)` : ((CONFIG.colors && CONFIG.colors.wallStroke) || '#334155');                 ctx.lineWidth = 2;                 ctx.beginPath();                 ctx.moveTo(base1.x, base1.y);                 ctx.lineTo(base2.x, base2.y);                 ctx.lineTo(bEnd.x, bEnd.y);                 ctx.lineTo(bStart.x, bStart.y);                 ctx.closePath();                 ctx.fill();                 ctx.stroke();                 ctx.beginPath();                 ctx.moveTo(wTop1.x, wTop1.y);                 ctx.lineTo(wTop2.x, wTop2.y);                 ctx.lineTo(top2.x, top2.y);                 ctx.lineTo(top1.x, top1.y);                 ctx.closePath();                 ctx.fill();                 ctx.stroke();             }             ctx.beginPath();             ctx.moveTo(bStart.x, bStart.y);             ctx.lineTo(bEnd.x, bEnd.y);             ctx.lineTo(wTop2.x, wTop2.y);             ctx.lineTo(wTop1.x, wTop1.y);             ctx.closePath();             let structuralColor;             if (type === 'DOOR') {                 structuralColor = (CONFIG.colors && CONFIG.colors.doorColor) || '#b45309';                 ctx.fillStyle = `rgba(180, 83, 9, ${opacity * 0.75})`;             } else if (type === 'WINDOW') {                 structuralColor = (CONFIG.colors && CONFIG.colors.windowColor) || '#67e8f9'; ctx.fillStyle = `rgba(103, 232, 249, ${opacity * 0.65})`; } else {                 structuralColor = (CONFIG.colors && CONFIG.colors.wallStroke) || '#334155';                 const grad = ctx.createLinearGradient(base1.x, base1.y, top1.x, top1.y);                 grad.addColorStop(0, `rgba(30, 41, 59, ${opacity})`);                 grad.addColorStop(1, `rgba(51, 65, 85, ${opacity})`);                 ctx.fillStyle = grad;             }             ctx.fill();             ctx.strokeStyle = isPreview ? `rgba(56, 189, 248, 0.4)` : structuralColor;             ctx.lineWidth = (type === 'WALL') ? 2 : 3;             ctx.stroke();             if (is3D || type === 'WALL') {                 ctx.beginPath();                 ctx.moveTo(top1.x, top1.y);                 ctx.lineTo(top2.x, top2.y);                 ctx.lineWidth = WALL_THICKNESS;                 ctx.lineCap = 'round';                 ctx.stroke();             }                                                                                      if (type === 'WINDOW') {                 ctx.beginPath();                 ctx.moveTo(bStart.x, bStart.y);                 ctx.lineTo(bEnd.x, bEnd.y);                 ctx.lineWidth = WALL_THICKNESS;                 ctx.stroke();             }         }                 function animate() {             ctx.clearRect(0, 0, width, height);                                                                                                                      const bgGrad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);             bgGrad.addColorStop(0, '#1e293b');             bgGrad.addColorStop(1, '#0f172a');             ctx.fillStyle = bgGrad;             ctx.fillRect(0, 0, width, height);                                                                                                                      /* 1. Draw the floor grid framework first so it sits at the absolute bottom layer */             drawGrid();                                                                                                                      /* 2. Sort the structural segments securely by depth profile */             const sortedSegments = [...segments].sort((a, b) => {                 const depthA = Math.max(a.p1.x + a.p1.y, a.p2.x + a.p2.y);                 const depthB = Math.max(b.p1.x + b.p1.y, b.p2.x + b.p2.y);                 return depthA - depthB;             });                                                                                      /* 3. Render the walls, doors, and windows on top of the background grid */             sortedSegments.forEach(seg => {                 drawRenderedSegment(seg.p1, seg.p2, seg.type);             });                                                                                                                      /* 4. Paint the active tool and cursor overlays at the very front layer */             if (activePath.length > 0 && (mode === 'WALL' || mode === 'DOOR')) {                 const targetPreviewPoint = { x: mouse.worldX, y: mouse.worldY };                 drawRenderedSegment(activePath[0], targetPreviewPoint, mode, true);             }                                                                                                                      if (mode === 'WINDOW') {                 const targetSegIdx = findClosestSegment(mouse.worldX, mouse.worldY);                 if (targetSegIdx !== -1 && segments[targetSegIdx].type === 'WALL') {                     const orig = segments[targetSegIdx];                     const dx = orig.p2.x - orig.p1.x;                     const dy = orig.p2.y - orig.p1.y;                     const len = Math.hypot(dx, dy);                                                                                                                              const winWidth = Math.min(GRID_SIZE * 2, len * 0.6);                     const ux = dx / len;                     const uy = dy / len;                                                                                                                              const wp1 = { x: mouse.worldX - ux * (winWidth / 2), y: mouse.worldY - uy * (winWidth / 2) };                     const wp2 = { x: mouse.worldX + ux * (winWidth / 2), y: mouse.worldY + uy * (winWidth / 2) };                                                                                                                              drawRenderedSegment(wp1, wp2, 'WINDOW', true);                 }             }                                                                                                                      const cursor = project(mouse.worldX, mouse.worldY, 0);             ctx.fillStyle = (CONFIG.colors && CONFIG.colors.accent) || '#38bdf8';             ctx.beginPath();             ctx.arc(cursor.x, cursor.y, 5, 0, Math.PI * 2);             ctx.fill();                                                                                                                      requestAnimationFrame(animate);         }                 window.onload = init;    </script>   </body>   </html>
