<!DOCTYPE html><html lang='en'><head>    <meta charset='UTF-8'>    <meta name='viewport' content='width=device-width, initial-scale=1.0'>    <title>Genetic Evolution Sandbox</title>    <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script>    <script src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'></script>    <style>        body { margin: 0; overflow: hidden; background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }        #ui {            position: absolute; top: 20px; left: 20px; color: #00f2ff; pointer-events: none;            background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 10px; border: 1px solid #00f2ff33;            backdrop-filter: blur(5px); text-shadow: 0 0 10px #00f2ff;        }        .stat-val { color: #fff; font-weight: bold; }    </style></head><body>    <div id='ui'>        <div style='font-size: 1.5em; margin-bottom: 10px;'>GENETIC SANDBOX</div>        <div>Generation: <span id='gen' class='stat-val'>1</span></div>        <div>Survivors: <span id='survivors' class='stat-val'>0</span></div>        <div>Top Fitness: <span id='fitness' class='stat-val'>0</span></div>        <div style='margin-top: 10px; font-size: 0.8em; opacity: 0.7;'>Creatures evolve to reach green energy nodes.</div>    </div><script>/** * SANDBOX PARAMETERS */const params = {    geneticPopulation: {{geneticpopulation}},     foodQuantity: {{foodquantity}},     mapSize: {{mapsize}},     creatureLifespan: {{creaturelifespan}},     mutationRate: {{mutationrate}},     evolveSpeed: {{evolvespeed}}, };let scene,  camera,  renderer,  controls;let creatures = [];let foods = [];let generation = {{generation}};let timer = {{timer}};/* --- GENETIC CORE --- */class DNA {    constructor(genes) {        // Genes define movement patterns at different life stages        if (genes) {            this.genes = genes;        } else {            this.genes = [];            for (let i = 0; i < params.creatureLifespan; i++) {                this.genes.push(new THREE.Vector3(                    (Math.random() - 0.5) * params.evolveSpeed,                    0,                    (Math.random() - 0.5) * params.evolveSpeed                ));            }        }    }    crossover(partner) {        let newGenes = [];        let mid = Math.floor(Math.random() * this.genes.length);        for (let i = 0; i < this.genes.length; i++) {            if (i > mid) newGenes[i] = this.genes[i];            else newGenes[i] = partner.genes[i];                        // Mutation            if (Math.random() < params.mutationRate) {                newGenes[i] = new THREE.Vector3(                    (Math.random() - 0.5) * params.evolveSpeed,                    0,                    (Math.random() - 0.5) * params.evolveSpeed                );            }        }        return new DNA(newGenes);    }}class Creature {    constructor(dna) {        this.dna = dna || new DNA();        this.fitness = 0;        this.pos = new THREE.Vector3(0, 1, 0);        this.vel = new THREE.Vector3();        this.acc = new THREE.Vector3();        this.completed = false;        const geo = new THREE.ConeGeometry(0.8,  2,  8);        const mat = new THREE.MeshPhongMaterial({             color: 0xff00ff,              emissive: 0x330033,              shininess: 100         });        this.mesh = new THREE.Mesh(geo, mat);        this.mesh.rotation.x = Math.PI / 2;        scene.add(this.mesh);    }    applyForce(force) {        this.acc.add(force);    }    update(step) {        if (this.completed) return;        // Check distance to any food        foods.forEach(f => {            let d = this.pos.distanceTo(f.position);            if (d < 3) {                this.completed = true;                this.fitness += (params.creatureLifespan - step); // Faster is better            }        });        this.applyForce(this.dna.genes[step]);        this.vel.add(this.acc);        this.pos.add(this.vel);        this.acc.set(0, 0, 0);        this.vel.multiplyScalar(0.95); // Friction        this.mesh.position.copy(this.pos);                // Orient towards movement        if (this.vel.length() > 0.01) {            const targetQuat = new THREE.Quaternion();            const lookMat = new THREE.Matrix4().lookAt(this.pos,  this.pos.clone().add(this.vel),  new THREE.Vector3(0, 1, 0));            targetQuat.setFromRotationMatrix(lookMat);            this.mesh.quaternion.slerp(targetQuat, 0.1);            this.mesh.rotateX(Math.PI/2);        }    }}function init() {    scene = new THREE.Scene();    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);    camera.position.set(0, 60, 60);    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });    renderer.setSize(window.innerWidth, window.innerHeight);    document.body.appendChild(renderer.domElement);    controls = new THREE.OrbitControls(camera, renderer.domElement);    // Lights    const ambient = new THREE.AmbientLight(0x404040,  2);    scene.add(ambient);    const light = new THREE.PointLight(0x00f2ff,  2,  200);    light.position.set(0, 50, 0);    scene.add(light);    // Map / Floor    const grid = new THREE.GridHelper(params.mapSize,  20,  0x00f2ff,  0x002233);    scene.add(grid);    const floorGeo = new THREE.PlaneGeometry(params.mapSize,  params.mapSize);    const floorMat = new THREE.MeshPhongMaterial({ color: 0x050505,  transparent: true,  opacity: 0.5 });    const floor = new THREE.Mesh(floorGeo,  floorMat);    floor.rotation.x = -Math.PI / 2;    scene.add(floor);    spawnFood();    for (let i = 0; i < params.geneticPopulation; i++) {        creatures.push(new Creature());    }    animate();}function spawnFood() {    foods.forEach(f => scene.remove(f));    foods = [];    const foodGeo = new THREE.SphereGeometry(1,  16,  16);    const foodMat = new THREE.MeshPhongMaterial({ color: 0x00ff00,  emissive: 0x00ff00 });        for (let i = 0; i < params.foodQuantity; i++) {        const f = new THREE.Mesh(foodGeo,  foodMat);        f.position.set(            (Math.random() - 0.5) * params.mapSize * 0.8,            1,            (Math.random() - 0.5) * params.mapSize * 0.8        );        scene.add(f);        foods.push(f);    }}function nextGeneration() {    // Selection    creatures.sort((a, b) => b.fitness - a.fitness);    const bestFitness = creatures[0].fitness;    document.getElementById('fitness').innerText = Math.round(bestFitness);    document.getElementById('survivors').innerText = creatures.filter(c => c.completed).length;    const pool = creatures.slice(0,  Math.floor(params.geneticPopulation / 2));    const nextGen = [];    for (let i = 0; i < params.geneticPopulation; i++) {        const parentA = pool[Math.floor(Math.random() * pool.length)].dna;        const parentB = pool[Math.floor(Math.random() * pool.length)].dna;        const childDNA = parentA.crossover(parentB);        nextGen.push(new Creature(childDNA));    }    // Cleanup    creatures.forEach(c => scene.remove(c.mesh));    creatures = nextGen;    generation++;    document.getElementById('gen').innerText = generation;    timer = 0;        // Randomly move food slightly to force adaptation    if(generation % 5 === 0) spawnFood();}function animate() {    requestAnimationFrame(animate);        if (timer < params.creatureLifespan) {        creatures.forEach(c => c.update(timer));        timer++;    } else {        nextGeneration();    }    controls.update();    renderer.render(scene, camera);}window.addEventListener('resize', () => {    camera.aspect = window.innerWidth / window.innerHeight;    camera.updateProjectionMatrix();    renderer.setSize(window.innerWidth, window.innerHeight);});init();</script></body></html>
