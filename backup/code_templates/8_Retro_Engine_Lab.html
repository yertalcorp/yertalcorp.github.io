<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Neon Cube Runner 2.5D</title>    <style>        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Courier New', Courier, monospace; }        canvas { display: block; }        #ui {             position: absolute; top: 20px; left: 20px; color: #0ff;             text-shadow: 0 0 10px #0ff; font-size: 20px; pointer-events: none;        }        #instructions {             position: absolute; bottom: 20px; width: 100%; text-align: center;             color: rgba(0, 255, 255, 0.5); font-size: 14px;         }    </style></head><body>    <div id="ui">        SCORE: <span id="currentScore">0</span><br>        HIGH SCORE: <span id="highScore">0</span>    </div>    <div id="instructions">PRESS SPACE OR CLICK TO JUMP</div>    <canvas id="gameCanvas"></canvas>    <script>const params = {            platformerMechanicsRunnerSpeed: {{platformermechanicsrunnerspeed}},             cubeJumpForce: {{cubejumpforce}},             redObstacleFrequency: {{redobstaclefrequency}},             totalHighScore: localStorage.getItem('cubeRunnerHigh') || 0,             retroGradientColors: ['#1a0033',  '#000022'],             gravity: {{gravity}},         };        const canvas = document.getElementById('gameCanvas');        const ctx = canvas.getContext('2d');        const scoreEl = document.getElementById('currentScore');        const highEl = document.getElementById('highScore');        let width,  height,  player,  obstacles,  score,  gameActive,  floorY;        class Cube {            constructor() {                this.size = 40;                this.x = 100;                this.y = floorY - this.size;                this.vy = 0;                this.isJumping = false;            }            update() {                this.vy += params.gravity;                this.y += this.vy;                if (this.y > floorY - this.size) {                    this.y = floorY - this.size;                    this.vy = 0;                    this.isJumping = false;                }            }            jump() {                if (!this.isJumping) {                    this.vy = -params.cubeJumpForce;                    this.isJumping = true;                }            }            draw() {                draw3DCube(this.x, this.y, this.size, '#00f7ff', '#0099aa');            }        }        class Obstacle {            constructor() {                this.size = 30 + Math.random() * 30;                this.x = width + 50;                this.y = floorY - this.size;            }            update() {                this.x -= params.platformerMechanicsRunnerSpeed;            }            draw() {                draw3DCube(this.x, this.y, this.size, '#ff0044', '#880022');            }        }        function draw3DCube(x, y, size, color, sideColor) {            const depth = size * 0.4;                        // Side face (3D effect)            ctx.fillStyle = sideColor;            ctx.beginPath();            ctx.moveTo(x + size, y);            ctx.lineTo(x + size + depth, y - depth);            ctx.lineTo(x + size + depth, y + size - depth);            ctx.lineTo(x + size, y + size);            ctx.closePath();            ctx.fill();            // Top face (3D effect)            ctx.fillStyle = color;            ctx.globalAlpha = 0.6;            ctx.beginPath();            ctx.moveTo(x, y);            ctx.lineTo(x + depth, y - depth);            ctx.lineTo(x + size + depth, y - depth);            ctx.lineTo(x + size, y);            ctx.closePath();            ctx.fill();            ctx.globalAlpha = 1.0;            // Front face            ctx.fillStyle = color;            ctx.fillRect(x, y, size, size);                        // Glow            ctx.shadowBlur = 15;            ctx.shadowColor = color;            ctx.strokeStyle = "rgba(255,255,255,0.5)";            ctx.strokeRect(x, y, size, size);            ctx.shadowBlur = 0;        }        function init() {            width = canvas.width = window.innerWidth;            height = canvas.height = window.innerHeight;            floorY = height * 0.75;            player = new Cube();            obstacles = [];            score = 0;            gameActive = true;            highEl.innerText = params.totalHighScore;        }        function spawnObstacle() {            if (Math.random() < params.redObstacleFrequency) {                obstacles.push(new Obstacle());            }        }        function update() {            if (!gameActive) return;            player.update();            spawnObstacle();            obstacles.forEach((obs, index) => {                obs.update();                                // Collision                if (                    player.x < obs.x + obs.size &&                    player.x + player.size > obs.x &&                    player.y < obs.y + obs.size &&                    player.y + player.size > obs.y                ) {                    gameOver();                }                if (obs.x + obs.size < 0) {                    obstacles.splice(index, 1);                    score++;                    scoreEl.innerText = score;                    params.platformerMechanicsRunnerSpeed += 0.05;                }            });        }        function draw() {            // Background Gradient            const grad = ctx.createLinearGradient(0,  0,  0,  height);            grad.addColorStop(0, params.retroGradientColors[0]);            grad.addColorStop(1, params.retroGradientColors[1]);            ctx.fillStyle = grad;            ctx.fillRect(0, 0, width, height);            // Floor Grid (2.5D perspective)            ctx.strokeStyle = "rgba(0, 255, 255, 0.2)";            ctx.lineWidth = 2;            for (let i = 0; i < 20; i++) {                let lineX = (i * width / 10 + (Date.now() * 0.1) % (width / 10));                ctx.beginPath();                ctx.moveTo(lineX, floorY);                ctx.lineTo(lineX - 400, height);                ctx.stroke();            }                        // Horizontal floor line            ctx.strokeStyle = "#0ff";            ctx.beginPath();            ctx.moveTo(0, floorY);            ctx.lineTo(width, floorY);            ctx.stroke();            player.draw();            obstacles.forEach(obs => obs.draw());            if (!gameActive) {                ctx.fillStyle = "rgba(0,0,0,0.7)";                ctx.fillRect(0, 0, width, height);                ctx.fillStyle = "#fff";                ctx.textAlign = "center";                ctx.font = "40px Courier New";                ctx.fillText("CRASHED!", width / 2, height / 2);                ctx.font = "20px Courier New";                ctx.fillText("CLICK TO RESTART", width / 2, height / 2 + 50);            }        }        function gameOver() {            gameActive = false;            if (score > params.totalHighScore) {                params.totalHighScore = score;                localStorage.setItem('cubeRunnerHigh', score);                highEl.innerText = score;            }        }        function loop() {            update();            draw();            requestAnimationFrame(loop);        }        window.addEventListener('keydown', (e) => {            if (e.code === 'Space') {                if (gameActive) player.jump();                else init();            }        });        window.addEventListener('mousedown', () => {            if (gameActive) player.jump();            else init();        });        window.addEventListener('resize', init);        init();        loop();</script></body></html>
