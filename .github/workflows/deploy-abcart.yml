name: Deploy ABCart to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "abcart/**"
      - ".github/workflows/deploy-abcart.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: yertal-abcart
          target: abcart
          entryPoint: ./abcart
          channelId: live
